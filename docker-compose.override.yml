# Host-side deviations for the MacBook hospital node (authored by us, NOT Sushil's file).
# Compose auto-merges docker-compose.override.yml. `!override` REPLACES the list —
# a plain merge would append and keep his original binding.
services:
  # 8081 is taken by our proxy (BAHMNI_PROXY_HTTP_PORT); 8082 is free on this Mac.
  schema-registry:
    ports: !override
      - '127.0.0.1:8082:8081'
  # Keep the sync layer loopback-only: nothing here should be on the LAN.
  kafka-connect:
    ports: !override
      - '127.0.0.1:8083:8083'
  mirrormaker-connect:
    ports: !override
      - '127.0.0.1:8084:8083'
  kafka:
    ports: !override
      - '127.0.0.1:9092:9092'
  zookeeper:
    ports: !override
      - '127.0.0.1:2181:2181'
  kafka-ui:
    ports: !override
      - '127.0.0.1:8086:8080'

  # Its entrypoint REWRITES whatever tree is mounted at /usr/local/bahmni_config.
  # With our [GUESS] CONFIG_IMAGE_NAME (bahmni/default-config) that overwrote BHS's
  # Amrit Clinics config with Bahmni defaults. Point it at a scratch dir so it can
  # never touch bahmni_config/ again. (Service has no profile → always starts.)
  bahmni-config:
    volumes: !override
      - './.local-config-scratch:/usr/local/bahmni_config'
  bahmni-mysql:
    # BL-045: striding as SERVER FLAGS, not `SET PERSIST`.
    #   • SET PERSIST is MySQL 8.0+ only and fails on the cloud (5.6.51, ERROR 1193)
    #   • SET PERSIST writes mysqld-auto.cnf into the DATADIR, so it is lost on a volume
    #     rebuild and the node silently reverts to increment 1
    # Base command is charset/sql-mode only and MUST be repeated: compose REPLACES `command`.
    # Offset 4 = Rawach, per Sushil's clinic map (Manpur 1, Bedawal 2, Ghated 3, Rawach 4,
    # Bagdunda 5, Kojawada 6; cloud 10). This lab clinic is Rawach (RAW prefix, Location-15).
    #
    # BL-039 durable fix (2026-08-28): wait_timeout was MySQL's stock 28800 (8h) on both
    # nodes — never a decision, just the default. The JDBC sinks hold pooled connections
    # between writes and validate nothing on checkout, so any idle gap longer than 8h left
    # them holding a dead socket; the next write got `Broken pipe`, Debezium wrapped it as
    # a non-retriable ConnectException, and Connect killed the task permanently while the
    # connector still read RUNNING. At BHS an overnight gap is normal operation, so this
    # fired roughly every morning. 7 days outlives any realistic idle window including a
    # long weekend. Applied live with SET GLOBAL on both nodes the same day; this line is
    # what makes it survive a container restart.
    command: >-
      --character-set-server=utf8 --collation-server=utf8_general_ci
      --sql-mode=NO_ENGINE_SUBSTITUTION
      --auto-increment-increment=10 --auto-increment-offset=4
      --wait-timeout=604800 --interactive-timeout=604800

  # OpenELIS lands in THIS container as a second database (`openelis`, schema
  # `clinlims`) alongside odoo — Module 28 §3.1, decision (i). Two consequences,
  # both recorded as BL-052: two logical-replication slots on one instance, and
  # a version skew against upstream's own openelis-db image.
  bahmni-postgres:
    # PG15 (overriding Sushil's ODOO_DB_IMAGE_NAME=postgres:14): publication row
    # filters (WHERE id%10=residue) are PG15+ and are how Module 28 enforces per-row
    # single-writer (L-001 at row granularity) WITHOUT a scripting SMT — the shared
    # Connect workers have no JSR223 engine, and adding one would disrupt the live
    # MySQL sync on restart. This instance is disposable (clinlims only; Odoo unused).
    image: postgres:15
    # Also joins the `openelis` profile: it now hosts the clinlims database too, so
    # `up -d openelis` must be able to bring its own dependency up.
    profiles: ["odoo", "local", "openelis"]
    # 5432 belongs to the host Homebrew Postgres (bahmni_dev / memory_db). Never take it.
    ports: !override
      - '127.0.0.1:5433:5432'
    # Debezium's pgoutput needs logical decoding; the base image ships wal_level=replica.
    # Two slots (odoo + openelis), so headroom above the default 10 is unnecessary but
    # explicit values keep this readable.
    command: >-
      postgres
      -c wal_level=logical
      -c max_replication_slots=10
      -c max_wal_senders=10

  # NEW SERVICE (not in Sushil's compose — the clinic side has never had OpenELIS).
  # Module 28 §3.1. Profile-gated so it never starts by accident; start it by name.
  openelis:
    profiles: ["openelis"]
    image: 'bahmni/openelis:${OPENELIS_IMAGE_TAG:-1.1.0-111}'
    ports:
      - '127.0.0.1:8052:8052'
    # Upstream start.sh dies in liquibase (see openelis/start-no-migrate.sh header).
    command: ['/start-no-migrate.sh']
    volumes:
      # start.sh symlinks /etc/bahmni_config/openelis -> /var/www/bahmni_config/openelis
      # and runs the implementation liquibase from it.
      - './bahmni-config:/etc/bahmni_config:ro'
      - './openelis/start-no-migrate.sh:/start-no-migrate.sh:ro'
    environment:
      TZ: ${TZ}
      # start.sh reads OPENELIS_DB_USERNAME; .env carries OPENELIS_DB_USER.
      OPENELIS_DB_SERVER: ${OPENELIS_DB_SERVER}
      OPENELIS_DB_PORT: ${OPENELIS_DB_PORT}
      OPENELIS_DB_NAME: ${OPENELIS_DB_NAME}
      OPENELIS_DB_USERNAME: ${OPENELIS_DB_USER}
      OPENELIS_DB_PASSWORD: ${OPENELIS_DB_PASSWORD}
      # update_openmrs_host_port.sh rewrites the ELIS-side feed bookmarks to this host.
      OPENMRS_HOST: ${OPENMRS_HOST}
      OPENMRS_PORT: ${OPENMRS_PORT}
      OPENMRS_ATOMFEED_USER: ${OPENMRS_ATOMFEED_USER}
      OPENMRS_ATOMFEED_PASSWORD: ${OPENMRS_ATOMFEED_PASSWORD}
    depends_on:
      bahmni-postgres:
        condition: service_healthy
    restart: ${RESTART_POLICY}

  # Mount an nginx conf that adds the /openelis route. Sushil's proxy/bahmni-nginx.conf
  # is baked into the image and left untouched; this is a copy plus one location block.
  proxy:
    volumes:
      - './proxy/bahmni-nginx.openelis.conf:/etc/nginx/nginx.conf:ro'
      # error_page 500 501 502 -> /internalError.html had no such file, so nginx turned
      # every upstream 500 into a 404. The page lives in proxy/htdocs/ beside
      # maintenance.html and unauthorized.html (the image's COPY ./htdocs/ picks it up on
      # the next build); mounted here so the fix applies without rebuilding the image.
      - './proxy/htdocs/internalError.html:/usr/share/nginx/html/internalError.html:ro'

  # Sushil's `openmrs` service forwards NO OPENELIS_* variables, so
  # bahmnicore.properties.template and update_elis_host_port.sh — both of which
  # interpolate ${OPENELIS_HOST}/${OPENELIS_PORT} — could only ever render
  # "http://:/" no matter what .env said. That is the real shape of BL-048.
  openmrs:
    environment:
      OPENELIS_HOST: ${OPENELIS_HOST}
      OPENELIS_PORT: ${OPENELIS_PORT}
      OPENELIS_ATOMFEED_USER: ${OPENELIS_ATOMFEED_USER}
      OPENELIS_ATOMFEED_PASSWORD: ${OPENELIS_ATOMFEED_PASSWORD}
    # Form definitions live on DISK; form_resource stores only the PATH. The
    # restored production DB references 133 files under /home/bahmni/clinical_forms
    # while the stock image ships 21, so opening a patient's Observations tab threw
    #   "Unable to read from the file with name
    #    /home/bahmni/clinical_forms/<uuid>.json (No such file or directory)"
    # for Adult Case Sheet and 131 others (observed 2026-08-28).
    #
    # docker-compose.yml:90 carries the mount that would supply them, commented out.
    # Mounting bahmni_home/clinical_forms ONLY, never the whole bahmni_home: the
    # container also has uploaded-files/ and uploaded_results/ under /home/bahmni
    # which the repo tree lacks, and a whole-directory mount would shadow them.
    #
    # Scope, measured: of the 136 references, 111 belong to RETIRED forms using
    # the pre-UUID naming convention (…/Adult_Case_Sheet_1.json). Those files
    # exist nowhere — not here, not in the repo, and not on the IPlet staging box
    # bhs-sandbox.bahmni.in, checked directly (381 form files there, a superset of
    # this repo's 370). Retired forms are never rendered, so that is correct, not
    # a gap. All 25 references belonging to ACTIVE forms now resolve: 25/25
    # present, 0 missing.
    #
    # Read-write on purpose: the implementer-interface writes new and edited forms
    # here, so authored forms land in the repo working tree (and show up in
    # `git status`) instead of vanishing with the container. :ro would break form
    # authoring.
    volumes:
      - "${CONTAINER_DATA_PATH:?}/bahmni_home/clinical_forms:/home/bahmni/clinical_forms"
