# Cloud → local sync (topics under bahmni-cloud / cloud.*).
# Format: table_name:primary_key_column[,pk2…]
# After edits: ./scripts/generate-sink-connectors.sh && register sinks on the clinic
# (or regenerate local sink connectors that consume cloud topics).

users:user_id
user_property:user_id,property
user_role:user_id,role
role:role
role_privilege:role,privilege
role_role:parent_role,child_role
provider:provider_id

# person and person_name were added to the running fleet but never to this file, so
# regenerating produced 7 sinks and silently dropped both. That is the BL-042 failure
# sync-core/F-012 closed: a cloud-created staff member arrives with roles present and
# REST reporting authenticated=true, but ZERO person_name rows -- the UI cannot render
# them and login is refused with no message, while the database reads clean. Verified
# 2026-09-14 against the live schema (person.person_id, person_name.person_name_id)
# and against the 9 mysql-local-sink-* connectors actually registered on both clinics.
person:person_id
person_name:person_name_id
