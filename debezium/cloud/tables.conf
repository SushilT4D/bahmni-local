# Cloud → local sync (topics under bahmni-cloud.*).
# Format: table_name:primary_key_column[,pk2…]
#
# THIS FILE LISTS ONLY CLOUD-OWNED TABLES. It is the down direction's ownership
# declaration, and the whitelist for the cloud-side Debezium source.
#
# ⚠ 2026-08-20: this file had been extended to 19 tables (the 12 clinic-owned
# clinical tables were appended) so that generate-sink-connectors.sh would emit the
# cloud's UP-direction sinks from it. That made the file contradict its own header
# and produced a cloud source whitelist containing person/patient/visit/encounter —
# i.e. the cloud would have captured rows that had just arrived FROM a clinic and
# sent them straight back down. Infinite loop, and an L-001 violation.
#
# The two lists are DIFFERENT INPUTS and must stay separate:
#   debezium/local/tables.conf  = clinic-owned → clinic source publishes, CLOUD sinks
#   debezium/cloud/tables.conf  = cloud-owned  → cloud source publishes, CLINIC sinks
# generate-cloud-source-connector.sh now hard-fails on any intersection.

users:user_id
user_property:user_id,property
user_role:user_id,role
role:role
role_privilege:role,privilege
role_role:parent_role,child_role
provider:provider_id
