# Clinics this hub accepts up-direction data from.
#
# Format:  clinic:connector_name_prefix:mm_prefix:server_name
#
#   clinic                 slug, for messages and output filtering only
#   connector_name_prefix  what every sink for this clinic is named with, before
#                          the table name. MUST be unique per clinic: registering
#                          two clinics under one name silently REPLACES the first
#                          clinic's live connector, which is how this generator
#                          could only ever serve one clinic.
#   mm_prefix              this clinic's MirrorMaker cluster alias -- the first
#                          segment of every topic it publishes to the hub. It is
#                          LOCAL_CLUSTER_ALIAS in the clinic's own .env.
#   server_name            this clinic's Debezium logical server name, i.e.
#                          MYSQL_SERVER_NAME in the clinic's .env.
#
# Topic consumed:  <mm_prefix>.<server_name>.<database>.<table>
#
# Clinic 1 predates per-clinic naming and its 12 live sinks are called
# mysql-sink-<table> with no clinic component. That is why its prefix below has
# no infix: renaming a live connector means dropping and recreating it, which
# restarts consumption from the stored offsets and is not worth doing merely for
# symmetry. A NEW clinic must take an infixed prefix.
#
# Values verified against the live hub on 2026-09-14: clinic 1 runs 12 sinks
# named mysql-sink-<table> on source.bahmni-local.*, clinic 2 runs 12 named
# mysql-sink-ghated-<table> on ghated.bahmni-ghated.*.

rawach:mysql-sink-:source:bahmni-local
ghated:mysql-sink-ghated-:ghated:bahmni-ghated
