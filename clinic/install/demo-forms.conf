# The stock demo forms of the Bahmni config package: the forms in its
# masterdata/configuration/bahmniforms folder, one uuid per line, each with the
# form's name and its file there. A stack that let the Initializer load every
# domain created them on its clinic; a clinic that keeps its own OpenMRS
# database across an upgrade still has them, and they show in its form lists.
# forms_retire_demo (forms.sh) retires them, never deletes them: observations
# saved with one still open with it.
#
# The list is explicit on purpose. The package's referral_letter.json carries
# the uuid of the hub's own "Referral letter" form, which every clinic uses, so
# it is not here; nor can the forms folder decide, since it holds the files of
# these forms too. Add a uuid only for a form no clinic uses.
