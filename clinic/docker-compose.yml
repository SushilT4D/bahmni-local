
x-default-logging: &default
  # An empty `{}` here merges nothing into x-log-config below, so all 14
  # services inheriting *log-config would run json-file with NO rotation
  # (HostConfig.LogConfig reads driver=json-file opts=map[] on every one), and
  # a single unrotated json.log can fill a clinic's VM disk past the preflight
  # floor.
  #
  # 50m x 3 bounds each container at 150 MB, so 14 services cannot exceed ~2 GB.
  # NOTE: log options are fixed at container CREATION -- existing containers keep
  # their unbounded config until recreated. Truncating the json.log reclaims the
  # space meanwhile and is safe while the container runs.
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-loki-logging: &loki
  driver: loki
  options:
    loki-url: ${LOKI_URL:?}
    mode: non-blocking
    max-buffer-size: 4m
    loki-retries: "3"

x-log-config: &log-config
  # update this value to *loki if needed to see logs in grafana dashboard.
  <<: *default

services:
  proxy:
    profiles: [ "local" ]
    image: bahmni-local/proxy:${PROXY_IMAGE_TAG}
    volumes:
      - ${CERTIFICATE_PATH}:/etc/tls:ro
      # IPLIT's UI and config, copied out of the two images pinned in
      # sync/versions.env by scripts/extract-ui-config.sh (installer task 045) into
      # the gitignored clinic/extracted/. nginx serves them; no second web server.
      - "${BAHMNI_UI_DIR:?run scripts/extract-ui-config.sh and set BAHMNI_UI_DIR (see .env.example)}:/usr/share/nginx/html/bahmni/:ro"
      - "${BAHMNI_CONFIG_DIR:?run scripts/extract-ui-config.sh and set BAHMNI_CONFIG_DIR (see .env.example)}:/usr/share/nginx/html/bahmni_config/:ro"
    # The image's own probe (wget http://localhost) could never pass: `localhost`
    # is ::1 inside the container and nginx listens on IPv4 only, and port 80
    # only redirects to a self-signed 443. This one asks for the login page over
    # IPv4/TLS, so it also fails when the UI mount is empty -- "healthy"
    # now means a browser would get the UI.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1/bahmni/home/index.html"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    ports:
      - '${BAHMNI_PROXY_HTTP_PORT:?}:80'
      - '${BAHMNI_PROXY_HTTPS_PORT:?}:443'
      # Odoo at root on its own TLS port. Odoo emits absolute URLs and cannot be
      # served under a sub-path, so it needs a port (or host) of its own.
      - '${BAHMNI_ODOO_HTTPS_PORT:-9444}:444'
    logging: *log-config
    restart: ${RESTART_POLICY}
    environment:
      TZ: ${TZ}

  bahmni-config:
    # The pinned IPLIT config image (was an unpinned bahmni/default-config:latest).
    # The override points its rewrite at a scratch dir; the tree the services read
    # is clinic/extracted/bahmni_config, filled from this same image by task 045.
    image: ${BAHMNI_CONFIG_IMAGE:?}
    volumes:
      - '${BAHMNI_CONFIG_PATH}:/usr/local/bahmni_config'
    logging: *log-config
    restart: ${RESTART_POLICY}

  bahmni-lab:
    profiles: ["lab-lite","emr","local"]
    image: 'bahmni/bahmni-lab:${BAHMNI_LAB_IMAGE_TAG:?}'
    logging: *log-config
    environment:
      TZ: ${TZ}

  openmrs:
    profiles: ["emr","local", "bahmni-mart"]
    # OPENMRS_IMAGE_NAME stays the fleet pin (sync/versions.env; rewritten into
    # .env by versions_put on every install step, so it can never carry a
    # node-local value). OPENMRS_RUN_IMAGE is set ONLY on arm64 hosts, by
    # install task 040 (openmrs/build-native.sh's native rebuild, since
    # OPENMRS_IMAGE_NAME is linux/amd64-only) -- an x86 clinic never sets it.
    image: ${OPENMRS_RUN_IMAGE:-${OPENMRS_IMAGE_NAME:?}}
    environment:
      TZ: ${TZ}
      OMRS_DB_NAME: ${OPENMRS_DB_NAME:?}
      OMRS_DB_HOSTNAME: ${BAHMNI_MYSQL_HOST:?}
      OMRS_DB_USERNAME: ${OPENMRS_DB_USERNAME:?}
      OMRS_DB_PASSWORD: ${OPENMRS_DB_PASSWORD:?}
      OMRS_CREATE_TABLES: ${OPENMRS_DB_CREATE_TABLES}
      OMRS_AUTO_UPDATE_DATABASE: ${OPENMRS_DB_AUTO_UPDATE}
      OMRS_MODULE_WEB_ADMIN: ${OPENMRS_MODULE_WEB_ADMIN}
      # OMRS_DEV_DEBUG_PORT: ${OMRS_DEV_DEBUG_PORT}
      OMRS_JAVA_SERVER_OPTS: ${OMRS_JAVA_SERVER_OPTS}
      OMRS_JAVA_MEMORY_OPTS: ${OMRS_JAVA_MEMORY_OPTS}
      SEND_MAIL: ${SEND_MAIL}
      MAIL_TRANSPORT_PROTOCOL: ${MAIL_TRANSPORT_PROTOCOL}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE}
      MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE}
      MAIL_DEBUG: ${MAIL_DEBUG}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      PHONE_NUMBER: ${PHONE_NUMBER:?}
      HIBERNATE_SHOW_SQL: ${HIBERNATE_SHOW_SQL}
      HIBERNATE_FORMAT_SQL: ${HIBERNATE_FORMAT_SQL}
      OMRS_DOCKER_ENV: ${OPENMRS_DOCKER_ENV}
      OMRS_C3P0_MAX_SIZE: ${OMRS_C3P0_MAX_SIZE}
      WEIGHT_CONCEPT_UUID: ${WEIGHT_CONCEPT_UUID}
      HEIGHT_CONCEPT_UUID: ${HEIGHT_CONCEPT_UUID}
      OMRS_DB_EXTRA_ARGS: ${OMRS_DB_EXTRA_ARGS}
      # staging sets both for this image; its startup script otherwise falls back to
      # the deprecated com.mysql.jdbc.Driver
      OMRS_DB_DRIVER_CLASS: ${OMRS_DB_DRIVER_CLASS:-com.mysql.cj.jdbc.Driver}
      LUCENE_SEARCH_INDEXING_STRATEGY: ${LUCENE_SEARCH_INDEXING_STRATEGY:-manual}
      LUCENE_MATCH_TYPE: ${LUCENE_MATCH_TYPE}
      DOCUMENT_MAX_SIZE_MB: ${DOCUMENT_MAX_SIZE_MB}
      OPENMRS_RUNTIME_PROPERTIES_hibernate_show_sql: "false"
      OPENMRS_RUNTIME_PROPERTIES_hibernate_format_sql: "false"
      OPENMRS_SERVER_PROPERTIES_hibernate_show_sql: "false"
      OPENMRS_SERVER_PROPERTIES_hibernate_format_sql: "false"
    #ports:
      # - ${OMRS_DEV_DEBUG_PORT}:${OMRS_DEV_DEBUG_PORT}
    volumes:
      # - "${CONTAINER_DATA_PATH}/bahmni_home:/home/bahmni"
      - "${BAHMNI_CONFIG_DIR:?}:/etc/bahmni_config/:ro"
      - "${CONTAINER_DATA_PATH}/data/bahmni-lab-results:/home/bahmni/uploaded_results"
      - "${CONTAINER_DATA_PATH}/data/bahmni-uploaded-files:/home/bahmni/uploaded-files"
      # - "${BAHMNI_OPENMRS_MODULES_PATH:?}/:/openmrs/data/modules/"
      - "${CONTAINER_DATA_PATH}/data/bahmni-patient-images:/home/bahmni/patient_images"
      - "${CONTAINER_DATA_PATH}/data/bahmni-document-images:/home/bahmni/document_images"
      - "${CONTAINER_DATA_PATH}/data/bahmni-clinical-forms:/home/bahmni/clinical_forms"
      - "${CONTAINER_DATA_PATH}/data/configuration_checksums:/openmrs/data/configuration_checksums"
      - "${CONTAINER_DATA_PATH}/data/openmrs/lucene:/openmrs/data/lucene"
      # - "${CONTAINER_DATA_PATH}/data/sms-token:/openmrs/data/sms-token"
      # - "${CONTAINER_DATA_PATH}/scripts/openmrs/custom-startup.sh:/openmrs/startup.sh:ro"
      # - "${CONTAINER_DATA_PATH}/data/openmrs/webapps:/usr/local/tomcat/webapps"
    # depends_on:
      # - openmrsdb
    logging: *log-config
    restart: ${RESTART_POLICY}

  odoo:
    profiles: ["odoo","local"]
    image: '${ODOO_IMAGE_NAME:?[ERROR]}'
    ports:
      - '8069:8069'
    volumes:
      - "${CONTAINER_DATA_PATH}/data/odoo:/var/lib/odoo"
      - ${EXTRA_ODOO_ADDONS_PATH}:/mnt/extra-addons
      - "${CONTAINER_DATA_PATH}/files/odoo:/var/lib/odoo/filestore"
      - "${CONTAINER_DATA_PATH}/config/odoo:/etc/odoo"
      # # Uncomment the below volume only when you need to modify existing bahmni-addons. Also make sure to update the .env file variable with bahmni-odoo-modules github repo cloned path.
      # - ${BAHMNI_ODOO_MODULES_PATH}:/opt/bahmni-erp/bahmni-addons
    depends_on:
      bahmni-postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      HOST: ${ODOO_DB_HOST}
      USER: ${ODOO_DB_USER}
      PASSWORD: ${ODOO_DB_PASSWORD}
    logging: *log-config
    restart: ${RESTART_POLICY}

  bahmni-web:
#    image: bahmni/bahmni-web:${BAHMNI_WEB_IMAGE_TAG:?}
    image: ${BAHMNI_WEB_IMAGE:?}
    profiles: ["unused"]
    volumes:
      # The same trees the proxy already serves (see the proxy service's
      # htdocs/bahmni and htdocs/bahmni_config mounts). An absolute path into one
      # developer's laptop here would give anyone who enabled this service two
      # empty read-only mounts and a blank UI.
      - "${BAHMNI_CONFIG_DIR:?}:/usr/local/apache2/htdocs/bahmni_config/:ro"
      - "${BAHMNI_UI_DIR:?}:/usr/local/apache2/htdocs/bahmni/:ro"
      # - "${CONFIG_BACKUP:?}:/usr/local/apache2/htdocs/bahmni_config_backup/"
      # - ${BAHMNI_APPS_PATH:?}/ui/app/:/usr/local/apache2/htdocs/bahmni
      # - "${BAHMNI_APPS_PATH:?}/ui/node_modules/@bower_components/:/usr/local/apache2/htdocs/bahmni/components"
    logging: *log-config
    restart: ${RESTART_POLICY}

  implementer-interface:
    image: bahmni/implementer-interface:${IMPLEMENTER_INTERFACE_IMAGE_TAG:?}
    profiles: ["implementer-interface","emr","local"]
    #volumes:
    #  - "${IMPLEMENTER_INTERFACE_CODE_PATH:?}/dist:/usr/local/apache2/htdocs/implementer-interface"
    # depends_on:  add this back when openmrs is ready -- 2025-12-15 sk
    #   - openmrs
    logging: *log-config
    restart: ${RESTART_POLICY}

  systemdate:
    image: bahmni-local/systemdate:1.0
    profiles: ["emr","local"]
    environment:
      TZ: ${TZ}
    logging: *log-config
    restart: ${RESTART_POLICY}

  # #########################################################
  # Database Containers                                     #
  # #########################################################
  bahmni-mysql:
    image: ${MYSQL_IMAGE:?}
    restart: always
    profiles: ["emr","local", "metabase", "bahmni-mart"]
    command: --character-set-server=utf8 --collation-server=utf8_general_ci --sql-mode=NO_ENGINE_SUBSTITUTION
    ports:
      - 3306:3306
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${OPENMRS_DB_NAME:?}
      MYSQL_USER: ${OPENMRS_DB_USERNAME:?}
      MYSQL_PASSWORD: ${OPENMRS_DB_PASSWORD:?}
    volumes:
      - ${CONTAINER_DATA_PATH}/data/mysql:/var/lib/mysql
      - "${CONTAINER_DATA_PATH}/data/configuration_checksums:/configuration_checksums"
      # InnoDB sizing rendered by the installer (task 020); read through my.cnf's
      # !includedir. A single-file bind mount: edit in place, then recreate.
      - "${CONTAINER_DATA_PATH}/config/mysql/sync-tuning.cnf:/etc/mysql/conf.d/sync-tuning.cnf:ro"

    logging: *log-config

  bahmni-postgres:
    profiles: ["odoo","local"]
    image: '${ODOO_DB_IMAGE_NAME:?[ERROR]}'
    volumes:
      - ${CONTAINER_DATA_PATH}/data/postgresql:/var/lib/postgresql/data
      - ${CONTAINER_DATA_PATH}/files/postgresql:/filestore:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U odoo']
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${ODOO_DB_NAME:?}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD}
      POSTGRES_USER: ${ODOO_DB_USER}
    logging: *log-config
    restart: ${RESTART_POLICY}

  patient-documents:
    image: 'bahmni/patient-documents:${PATIENT_DOCUMENTS_TAG:?}'
    profiles: ["emr","local"]
    volumes:
      - "${CONTAINER_DATA_PATH}/data/bahmni-document-images:/usr/share/nginx/html/document_images"
      - "${CONTAINER_DATA_PATH}/data/bahmni-lab-results:/usr/share/nginx/html/uploaded_results"
      - "${CONTAINER_DATA_PATH}/data/bahmni-uploaded-files:/usr/share/nginx/html/uploaded-files"
    environment:
      TZ: ${TZ}
      OPENMRS_HOST: ${OPENMRS_HOST:?}
    # depends_on:  add this back when openmrs is ready -- 2025-12-15 sk
    #   - openmrs
    logging: *log-config
    restart: ${RESTART_POLICY}


  atomfeed-console:
    image: bahmni/atomfeed-console:latest
    profiles: ["atomfeed-console", "local"]
    restart: ${RESTART_POLICY}
    environment:
      TZ: ${TZ}
      OPENMRS_DB_HOST: ${BAHMNI_MYSQL_HOST}
      OPENMRS_DB_NAME: ${OPENMRS_DB_NAME}
      OPENMRS_DB_USERNAME: ${OPENMRS_DB_USERNAME}
      OPENMRS_DB_PASSWORD: ${OPENMRS_DB_PASSWORD}

  restore_volumes:
    image: bash:5.2.15
    profiles: ["restore"]
    command: "bash /restore_docker_volumes.sh"
    volumes:
        - "${RESTORE_ARTIFACTS_PATH}:/restore-artifacts"
        - '../backup_restore/restore_docker_volumes.sh:/restore_docker_volumes.sh'
        - 'bahmni-patient-images:/mounts/bahmni-patient-images'
        - 'bahmni-document-images:/mounts/bahmni-document-images'
        - 'bahmni-clinical-forms:/mounts/bahmni-clinical-forms'
        - 'bahmni-lab-results:/mounts/bahmni-lab-results'
        - 'bahmni-uploaded-files:/mounts/bahmni-uploaded-files'
        - 'bahmni-queued-reports:/mounts/bahmni-queued-reports'
        - 'configuration_checksums:/mounts/configuration_checksums'
  
  cdss:
    profiles: [ "cdss" ]
    image: bahmni/cdss-reference:${CDSS_IMAGE_TAG:?}
    environment:
      JAVA_OPTS: ${CDSS_JAVA_SERVER_OPTS}
    logging: *log-config

  snowstorm-lite:
    profiles: [ "snowstorm-lite" ]
    image: snomedinternational/snowstorm-lite:${SNOWSTORM_LITE_IMAGE_TAG:?}
    environment:
      JDK_JAVA_OPTIONS: ${SNOWSTORM_LITE_JAVA_SERVER_OPTS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/fhir/CodeSystem"]
      interval: 60s
      timeout: 15s
      retries: 10
    logging: *log-config

  load-snowstorm-lite-data:
    profiles: [ "snowstorm-lite" ]
    image: alpine
    command: "sh /load-snowstorm-data.sh"
    environment:
      SNOWSTORM_LITE_ADMIN_PASSWORD: ${SNOWSTORM_LITE_ADMIN_PASSWORD:?}
    logging: *log-config
    volumes:
      - '../snomed-resources/load-snowstorm-data.sh:/load-snowstorm-data.sh'
    #  - "${SNOWSTORM_RF2_FILE_PATH:?}:/snowstorm-data/snomed-data.zip:ro"

  # #########################################################
  # Debezium Containers                                        #
  # #########################################################

  # --- KRaft migration (KIP-866): dedicated controller quorum ---
  # Runs alongside ZooKeeper in migration mode; metadata is copied ZK -> KRaft
  # and dual-written until the broker is flipped to pure KRaft.
  kafka-controller:
    profiles: [ "debezium" ]
    image: ${KAFKA_IMAGE:?}
    hostname: kafka-controller
    container_name: kafka-controller
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?}
      KAFKA_NODE_ID: 3000
      KAFKA_PROCESS_ROLES: 'controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '3000@kafka-controller:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENERS: 'CONTROLLER://0.0.0.0:9093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - "${CONTAINER_DATA_PATH}/data/kafka-controller:/var/lib/kafka/data"
    # 8.3.2 (AK 4.3) image defect for a controller-only KRaft node (see
    # sync/tests/kafka-8-notes.md): the image bakes ENV KAFKA_ADVERTISED_LISTENERS=""
    # (present but empty, not unset). /etc/confluent/docker/configure explicitly
    # refuses a non-empty KAFKA_ADVERTISED_LISTENERS on a controller-only node
    # ("is not supported on a KRaft controller"), but its own envToProps template
    # dump still emits the baked-in empty value as `advertised.listeners=` (present,
    # empty) into kafka.properties -- and AK 4.3's StorageTool preflight now rejects
    # that with "Configuration 'advertised.listeners' must not be empty" (7.6 did
    # not). Neither setting nor leaving the compose env var alone avoids this; the
    # var must be truly unset (not merely empty) before the entrypoint's template
    # render, which compose's `environment:` cannot express. Verified by hand with
    # `docker run --entrypoint /etc/confluent/docker/configure` against both states.
    command: ["/bin/bash", "-c", "unset KAFKA_ADVERTISED_LISTENERS; exec /etc/confluent/docker/run"]

  kafka:
    profiles: [ "debezium" ]
    image: ${KAFKA_IMAGE:?}
    hostname: kafka
    container_name: kafka
    depends_on:
      kafka-controller:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      # --- KRaft (KIP-866) stage 2: pure KRaft; ZooKeeper no longer consulted ---
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '3000@kafka-controller:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # Extended retention for offline buffering (7 days default, increase if needed)
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-168}
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      # Increase retention bytes to handle longer offline periods
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_RETENTION_BYTES:--1}
    volumes:
      - "${CONTAINER_DATA_PATH}/data/kafka:/var/lib/kafka/data"
    healthcheck:
      # The probe starts a JVM. On a loaded 1-vCPU host (manpur) it cannot finish
      # in 5 s, and a 10 s interval keeps one JVM permanently starting.
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 180s

  schema-registry:
    profiles: [ "debezium" ]
    image: ${SCHEMA_REGISTRY_IMAGE:?}
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      LOG4J_LOGGERS: "io.confluent.rest-utils.requests=WARN"
    healthcheck:
      # 8.3.2's confluentinc/cp-schema-registry image no longer ships curl or
      # wget (7.6 did) -- a curl-based CMD healthcheck permanently failed with
      # "exec: curl: executable file not found in $PATH" even though the app
      # itself was up and answering on 8081 (verified: curl to the published
      # port from the host returned 200 the whole time). bash + /dev/tcp is
      # available in the image and needs no external binary. A bare TCP
      # connect is not enough -- a bound port is not a serving registry, and
      # kafka-connect gates on this via depends_on: service_healthy -- so this
      # sends a real HTTP/1.0 request over the /dev/tcp fd and asserts the
      # status line contains " 200 ". Proven on both 8.3.2 and 7.6.0 (the
      # image this same compose file still runs on the live node) -- see
      # sync/tests/kafka-8-notes.md.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /subjects HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-connect:
    profiles: [ "debezium" ]
    image: ${DEBEZIUM_CONNECT_IMAGE:?}
    hostname: kafka-connect
    container_name: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_TOPIC: docker-connect-offsets
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_TOPIC: docker-connect-status
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_PLUGIN_PATH: /kafka/connect
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_PORT: 8083
      LOG4J_LOGGERS: "org.apache.kafka.connect.runtime.rest.RestServer=WARN,org.apache.kafka.clients.NetworkClient=WARN"
    volumes:
      - "${CONTAINER_DATA_PATH}/data/kafka-connect/connectors:/kafka/connect/connectors:ro"
      - "${CONTAINER_DATA_PATH}/data/kafka-connect:/kafka/connect/data"
      - "${CONTAINER_DATA_PATH}/config/kafka-connect/log4j.properties:/kafka/config/log4j.properties"
      - "${CONTAINER_DATA_PATH}/config/kafka-connect/log4j2.yml:/kafka/config/log4j2.yml"
    healthcheck:
      # Connect scans every plugin before its REST port opens: minutes on a small
      # host. Without a start_period it was "unhealthy" after ~50 s and compose
      # refused everything gated on it.
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 900s

  mirrormaker-connect:
    profiles: [ "debezium" ]
    image: ${MM2_IMAGE:?}
    hostname: mirrormaker-connect
    container_name: mirrormaker-connect
    # depends_on:
    #   kafka:
    #     condition: service_healthy
    ports:
      - "8084:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: mirrormaker-connect
      CONNECT_GROUP_ID: mirrormaker-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: mirrormaker-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_TOPIC: mirrormaker-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: mirrormaker-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.converters.ByteArrayConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.converters.ByteArrayConverter
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      # Enable MirrorMaker connectors
      CONNECT_REST_ADVERTISED_PORT: 8083
      REMOTE_KAFKA_BOOTSTRAP_SERVERS: ${REMOTE_KAFKA_BOOTSTRAP_SERVERS}
      REMOTE_KAFKA_USERNAME: ${REMOTE_KAFKA_USERNAME:?}
      REMOTE_KAFKA_PASSWORD: ${REMOTE_KAFKA_PASSWORD:?}
      REMOTE_KAFKA_SSL_TRUSTSTORE_PASSWORD: ${REMOTE_KAFKA_SSL_TRUSTSTORE_PASSWORD:?}
      KAFKA_TOPIC_PATTERNS: ${KAFKA_TOPIC_PATTERNS:-.*}
      # Next line because image has botched location to $base_dir/../config/connect-log4j.properties"
      KAFKA_LOG4J_OPTS: "-Dlog4j.configuration=file:/etc/kafka-connect/log4j.properties"
      LOG4J_LOGGERS: "org.apache.kafka.connect.runtime.rest.RestServer=WARN,org.apache.kafka.clients.NetworkClient=WARN"
    volumes:
      - "${CONTAINER_DATA_PATH}/certs/kafka/kafka.truststore.p12:/etc/kafka-connect/secrets/kafka.truststore.p12"
      - "${CONTAINER_DATA_PATH}/data/mirrormaker:/kafka/connect/data"
      - "${CONTAINER_DATA_PATH}/config/mirrormaker/mm2.properties:/etc/kafka-connect/mm2.properties:ro"
      - "${CONTAINER_DATA_PATH}/config/mirrormaker/start-mm2.sh:/etc/kafka-connect/start-mm2.sh:ro"
      - "${CONTAINER_DATA_PATH}/config/mirrormaker/log4j.properties:/etc/kafka-connect/log4j.properties"
    restart: unless-stopped
    command: ["/bin/bash", "/etc/kafka-connect/start-mm2.sh"]

  # Optional: Kafka UI for monitoring local setup
  kafka-ui:
    profiles: [ "debezium" ]
    image: provectuslabs/kafka-ui:latest
    hostname: kafka-ui
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      KAFKA_CLUSTERS_1_NAME: MAD
      KAFKA_CLUSTERS_1_BOOTSTRAPSERVERS: 13.126.229.17:9092
      KAFKA_CLUSTERS_1_ZOOKEEPER: 13.126.229.17:2181
      KAFKA_CLUSTERS_1_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_1_KAFKACONNECT_0_ADDRESS: http://13.126.229.17:8083
      # Authentication
      # AUTH_TYPE: "LOGIN_FORM"
      # SPRING_SECURITY_USER_NAME: "admin"
      # SPRING_SECURITY_USER_PASSWORD: "admin123"

  # kafka-ui-proxy:
