# Clinic-node changes to the base file. `!override` replaces a list instead of
# appending to it.
x-rotate-logs: &rotate
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  atomfeed-console:
    logging: *rotate
  kafka-connect:
    logging: *rotate
    ports: !override
      - '127.0.0.1:8083:8083'
    volumes:
      - '${CONTAINER_DATA_PATH}/config/kafka-connect/ext/groovy-${GROOVY_VERSION:?}.jar:/kafka/connect/debezium-connector-jdbc/groovy-${GROOVY_VERSION:?}.jar:ro'
      - '${CONTAINER_DATA_PATH}/config/kafka-connect/ext/groovy-jsr223-${GROOVY_VERSION:?}.jar:/kafka/connect/debezium-connector-jdbc/groovy-jsr223-${GROOVY_VERSION:?}.jar:ro'
      - '${CONTAINER_DATA_PATH}/config/kafka-connect/ext/debezium-scripting-${DEBEZIUM_SCRIPTING_VERSION:?}.jar:/kafka/connect/debezium-connector-jdbc/debezium-scripting-${DEBEZIUM_SCRIPTING_VERSION:?}.jar:ro'
      - '${CONTAINER_DATA_PATH}/config/kafka-connect/ext/groovy-${GROOVY_VERSION:?}.jar:/kafka/connect/debezium-connector-mysql/groovy-${GROOVY_VERSION:?}.jar:ro'
      - '${CONTAINER_DATA_PATH}/config/kafka-connect/ext/groovy-jsr223-${GROOVY_VERSION:?}.jar:/kafka/connect/debezium-connector-mysql/groovy-jsr223-${GROOVY_VERSION:?}.jar:ro'
      - '${CONTAINER_DATA_PATH}/config/kafka-connect/ext/debezium-scripting-${DEBEZIUM_SCRIPTING_VERSION:?}.jar:/kafka/connect/debezium-connector-mysql/debezium-scripting-${DEBEZIUM_SCRIPTING_VERSION:?}.jar:ro'
  mirrormaker-connect:
    logging: *rotate
    ports: !override
      - '127.0.0.1:8084:8083'
  kafka:
    logging: *rotate
  kafka-ui:
    logging: *rotate
    ports: !override
      - '127.0.0.1:8086:8080'

  # Its entrypoint rewrites whatever is mounted here, so it gets a scratch dir.
  bahmni-config:
    volumes: !override
      - './.local-config-scratch:/usr/local/bahmni_config'
  bahmni-mysql:
    # `command` replaces the base one, so the base flags are repeated.
    # Striding is a server flag so it survives a rebuilt data volume.
    command: >-
      --character-set-server=utf8 --collation-server=utf8_general_ci
      --sql-mode=NO_ENGINE_SUBSTITUTION
      --auto-increment-increment=10 --auto-increment-offset=${MYSQL_AUTO_INCREMENT_OFFSET:?}
      --server-id=${MYSQL_SERVER_ID:?}
      --wait-timeout=604800 --interactive-timeout=604800

  # Hosts both the odoo and the openelis databases.
  bahmni-postgres:
    image: ${POSTGRES_IMAGE:?}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:?}
      POSTGRES_DB: postgres
    volumes: !override
      - '${CONTAINER_DATA_PATH}/data/postgresql16:/var/lib/postgresql/data'
      - '${CONTAINER_DATA_PATH}/files/postgresql:/filestore:ro'
    profiles: ["odoo", "local", "openelis"]
    ports: !override
      - '127.0.0.1:5433:5432'
    command: >-
      postgres
      -c wal_level=logical
      -c max_replication_slots=10
      -c max_wal_senders=10

  openelis:
    profiles: ["openelis"]
    image: 'bahmni/openelis:${OPENELIS_IMAGE_TAG:-1.1.0-111}'
    ports:
      - '127.0.0.1:8052:8052'
    command: ['/start-no-migrate.sh']
    volumes:
      - '${BAHMNI_CONFIG_DIR:?}:/etc/bahmni_config:ro'
      - './openelis/start-no-migrate.sh:/start-no-migrate.sh:ro'
    environment:
      TZ: ${TZ}
      OPENELIS_DB_SERVER: ${OPENELIS_DB_SERVER}
      OPENELIS_DB_PORT: ${OPENELIS_DB_PORT}
      OPENELIS_DB_NAME: ${OPENELIS_DB_NAME}
      OPENELIS_DB_USERNAME: ${OPENELIS_DB_USER}
      OPENELIS_DB_PASSWORD: ${OPENELIS_DB_PASSWORD}
      OPENMRS_HOST: ${OPENMRS_HOST}
      OPENMRS_PORT: ${OPENMRS_PORT}
      OPENMRS_ATOMFEED_USER: ${OPENMRS_ATOMFEED_USER}
      OPENMRS_ATOMFEED_PASSWORD: ${OPENMRS_ATOMFEED_PASSWORD}
    depends_on:
      bahmni-postgres:
        condition: service_healthy
    restart: ${RESTART_POLICY}

  # Mounted rather than built in, so an edit needs no image rebuild.
  proxy:
    volumes:
      - './proxy/bahmni-nginx.openelis.conf:/etc/nginx/nginx.conf:ro'
      - './proxy/htdocs/internalError.html:/usr/share/nginx/html/internalError.html:ro'
      - './proxy/05-clinic-resolver.sh:/docker-entrypoint.d/05-clinic-resolver.sh:ro'
      - './proxy/htdocs/index.html:/usr/share/nginx/html/index.html:ro'

  openmrs:
    # Set per node: memory outside the Java heap grows with the database size.
    mem_limit: ${OPENMRS_MEM_LIMIT:?}
    environment:
      OPENELIS_HOST: ${OPENELIS_HOST}
      OPENELIS_PORT: ${OPENELIS_PORT}
      OPENELIS_ATOMFEED_USER: ${OPENELIS_ATOMFEED_USER}
      OPENELIS_ATOMFEED_PASSWORD: ${OPENELIS_ATOMFEED_PASSWORD}
    # Read-write: the implementer interface saves forms here.
    volumes:
      - "${CONTAINER_DATA_PATH:?}/bahmni_home/clinical_forms:/home/bahmni/clinical_forms"
  # The image is published for amd64 only.
  odoo:
    platform: linux/amd64

  odoo-connect:
    logging: *rotate
    volumes:
      - '${CONTAINER_DATA_PATH:?}/odoo/logback-erp-connect.xml:/run/bahmni-erp-connect/bahmni-erp-connect/WEB-INF/classes/logback.xml:ro'
      # HttpClient 5, which the image calls and does not ship.
      - '${CONTAINER_DATA_PATH:?}/odoo/erp-connect-lib/httpclient5-5.1.4.jar:/run/bahmni-erp-connect/bahmni-erp-connect/WEB-INF/lib/httpclient5-5.1.4.jar:ro'
      - '${CONTAINER_DATA_PATH:?}/odoo/erp-connect-lib/httpcore5-5.1.5.jar:/run/bahmni-erp-connect/bahmni-erp-connect/WEB-INF/lib/httpcore5-5.1.5.jar:ro'
      - '${CONTAINER_DATA_PATH:?}/odoo/erp-connect-lib/httpcore5-h2-5.1.5.jar:/run/bahmni-erp-connect/bahmni-erp-connect/WEB-INF/lib/httpcore5-h2-5.1.5.jar:ro'
    profiles: ["odoo","local"]
    image: 'bahmni/odoo-connect:${ODOO_CONNECT_IMAGE_TAG}'
    platform: linux/amd64
    environment:
      ODOO_DB_SERVER: bahmni-postgres
      IS_ODOO_16: "true"
      TZ: ${TZ}
      ODOO_DB_USERNAME: ${ODOO_DB_USER}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD}
      OPENMRS_HOST: ${OPENMRS_HOST}
      OPENMRS_PORT: ${OPENMRS_PORT}
      OPENMRS_ATOMFEED_USER: ${OPENMRS_ATOMFEED_USER}
      OPENMRS_ATOMFEED_PASSWORD: ${OPENMRS_ATOMFEED_PASSWORD}
      OPENELIS_HOST: ${OPENELIS_HOST}
      OPENELIS_PORT: ${OPENELIS_PORT}
      OPENELIS_ATOMFEED_USER: ${OPENELIS_ATOMFEED_USER}
      OPENELIS_ATOMFEED_PASSWORD: ${OPENELIS_ATOMFEED_PASSWORD}
      ODOO_HOST: ${ODOO_HOST}
      ODOO_PORT: ${ODOO_PORT}
      ODOO_ATOMFEED_USER: ${ODOO_ATOMFEED_USER}
      ODOO_ATOMFEED_PASSWORD: ${ODOO_ATOMFEED_PASSWORD}
    depends_on:
      bahmni-postgres:
        condition: service_healthy
    restart: ${RESTART_POLICY}
