# Host-side deviations for the MacBook hospital node (authored by us, NOT Sushil's file).
# Compose auto-merges docker-compose.override.yml. `!override` REPLACES the list —
# a plain merge would append and keep his original binding.
x-rotate-logs: &rotate
  # Rotation for the services that inherit NO logging config from the base file.
  # These are the ones that actually filled the disk: on 2026-09-15 odoo-connect
  # held a single 13.9 GB json.log and mirrormaker-connect 5.8 GB, together most
  # of the 21.1 GB in /var/lib/docker/containers that had taken Rawach to 95% of
  # its 58 GB VM disk and under the F-022 floor.
  #
  # The base file defines x-log-config, but its x-default-logging was `{}` so it
  # merged nothing, and these services never referenced it anyway. A YAML anchor
  # is file-scoped and odoo-connect exists ONLY here (odoodb, the other original
  # reason for this note, was removed 2026-09-17 -- sync-core Task 4), so it is
  # redeclared.
  #
  # Log options are fixed at container CREATION: existing containers keep their
  # unbounded config until recreated. Truncating the json.log reclaims the space
  # meanwhile and is safe on a running container.
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # Rotation only: defined in the base file, bounded here.
  atomfeed-console:
    logging: *rotate
  kafka-controller:
    logging: *rotate
  # 8081 is taken by our proxy (BAHMNI_PROXY_HTTP_PORT); 8082 is free on this Mac.
  schema-registry:
    logging: *rotate
    ports: !override
      - '127.0.0.1:8082:8081'
  # Keep the sync layer loopback-only: nothing here should be on the LAN.
  kafka-connect:
    logging: *rotate
    ports: !override
      - '127.0.0.1:8083:8083'
    # Replication-origin loop guard, clinic half (sync-core F-042 follow-on, 2026-09-09;
    # moved off the c3p0 customizer 2026-09-17 -- Debezium 3.6.2 replaced c3p0 with Agroal,
    # DBZ-8899). The claim is now config-only: each clinic-side PG sink's own connector
    # JSON carries hibernate.agroal.initialSQL = pg_replication_origin_session_setup('hub_N'),
    # one distinct origin per sink connector on this node, pool size 1 (PG allows one
    # session per origin). Nothing to mount here for that anymore.
    volumes:
      # Filter SMT runtime (jsr223.groovy) for the mysql source and the PG sinks. Previously
      # docker-cp'd into the container and lost on recreate; see ext/fetch-scripting-jars.sh.
      # Filenames follow sync/versions.env's GROOVY_VERSION / DEBEZIUM_SCRIPTING_VERSION,
      # rendered into this node's live clinic/.env (still 4.0.22 / 3.2.4.Final there).
      - '${CONTAINER_DATA_PATH}/config/kafka-connect/ext/groovy-${GROOVY_VERSION:?}.jar:/kafka/connect/debezium-connector-jdbc/groovy-${GROOVY_VERSION:?}.jar:ro'
      - '${CONTAINER_DATA_PATH}/config/kafka-connect/ext/groovy-jsr223-${GROOVY_VERSION:?}.jar:/kafka/connect/debezium-connector-jdbc/groovy-jsr223-${GROOVY_VERSION:?}.jar:ro'
      - '${CONTAINER_DATA_PATH}/config/kafka-connect/ext/debezium-scripting-${DEBEZIUM_SCRIPTING_VERSION:?}.jar:/kafka/connect/debezium-connector-jdbc/debezium-scripting-${DEBEZIUM_SCRIPTING_VERSION:?}.jar:ro'
      - '${CONTAINER_DATA_PATH}/config/kafka-connect/ext/groovy-${GROOVY_VERSION:?}.jar:/kafka/connect/debezium-connector-mysql/groovy-${GROOVY_VERSION:?}.jar:ro'
      - '${CONTAINER_DATA_PATH}/config/kafka-connect/ext/groovy-jsr223-${GROOVY_VERSION:?}.jar:/kafka/connect/debezium-connector-mysql/groovy-jsr223-${GROOVY_VERSION:?}.jar:ro'
      - '${CONTAINER_DATA_PATH}/config/kafka-connect/ext/debezium-scripting-${DEBEZIUM_SCRIPTING_VERSION:?}.jar:/kafka/connect/debezium-connector-mysql/debezium-scripting-${DEBEZIUM_SCRIPTING_VERSION:?}.jar:ro'
  mirrormaker-connect:
    logging: *rotate
    ports: !override
      - '127.0.0.1:8084:8083'
  kafka:
    logging: *rotate
    ports: !override
      - '127.0.0.1:9092:9092'
  kafka-ui:
    logging: *rotate
    ports: !override
      - '127.0.0.1:8086:8080'

  # Its entrypoint REWRITES whatever tree is mounted at /usr/local/bahmni_config.
  # With our [GUESS] CONFIG_IMAGE_NAME (bahmni/default-config) that overwrote BHS's
  # Amrit Clinics config with Bahmni defaults. Point it at a scratch dir so it can
  # never touch bahmni_config/ again. (Service has no profile → always starts.)
  bahmni-config:
    volumes: !override
      - './.local-config-scratch:/usr/local/bahmni_config'
  bahmni-mysql:
    # BL-045: striding as SERVER FLAGS, not `SET PERSIST`.
    #   • SET PERSIST is MySQL 8.0+ only and fails on the cloud (5.6.51, ERROR 1193)
    #   • SET PERSIST writes mysqld-auto.cnf into the DATADIR, so it is lost on a volume
    #     rebuild and the node silently reverts to increment 1
    # Base command is charset/sql-mode only and MUST be repeated: compose REPLACES `command`.
    # Offset 4 = Rawach, per Sushil's clinic map (Manpur 1, Bedawal 2, Ghated 3, Rawach 4,
    # Bagdunda 5, Kojawada 6; cloud 10). This lab clinic is Rawach (RAW prefix, Location-15).
    #
    # BL-039 durable fix (2026-08-28): wait_timeout was MySQL's stock 28800 (8h) on both
    # nodes — never a decision, just the default. The JDBC sinks hold pooled connections
    # between writes and validate nothing on checkout, so any idle gap longer than 8h left
    # them holding a dead socket; the next write got `Broken pipe`, Debezium wrapped it as
    # a non-retriable ConnectException, and Connect killed the task permanently while the
    # connector still read RUNNING. At BHS an overnight gap is normal operation, so this
    # fired roughly every morning. 7 days outlives any realistic idle window including a
    # long weekend. Applied live with SET GLOBAL on both nodes the same day; this line is
    # what makes it survive a container restart.
    command: >-
      --character-set-server=utf8 --collation-server=utf8_general_ci
      --sql-mode=NO_ENGINE_SUBSTITUTION
      --auto-increment-increment=10 --auto-increment-offset=${MYSQL_AUTO_INCREMENT_OFFSET:?}
      --server-id=${MYSQL_SERVER_ID:?}
      --wait-timeout=604800 --interactive-timeout=604800
    # ⚠ 2026-09-02: THIS LINE IS NOT RE-READ ON RESTART. The running container was
    #   created 2026-08-20, before the line was added, so `docker compose restart`
    #   (and a machine reboot) kept the OLD command and Rawach was still on the stock
    #   28800 two weeks later -- the sinks died again after a 13h overnight gap.
    #   `docker inspect <c> --format '{{.Config.Cmd}}' is the only truthful check;
    #   the file agreeing with intent proves nothing. Requires `up -d --force-recreate
    #   bahmni-mysql` to take effect. Applied live with SET GLOBAL in the meantime.
    #   The durable defence is now client-side: hibernate.c3p0.* on every JDBC sink.

  # OpenELIS lands in THIS container as a second database (`openelis`, schema
  # `clinlims`) alongside odoo — Module 28 §3.1, decision (i). Two consequences,
  # both recorded as BL-052: two logical-replication slots on one instance, and
  # a version skew against upstream's own openelis-db image.
  bahmni-postgres:
    # PG15 (overriding Sushil's ODOO_DB_IMAGE_NAME=postgres:14): publication row
    # filters (WHERE id%10=residue) are PG15+ and are how Module 28 enforces per-row
    # single-writer (L-001 at row granularity) WITHOUT a scripting SMT — the shared
    # Connect workers have no JSR223 engine, and adding one would disrupt the live
    # MySQL sync on restart. This instance is disposable (clinlims only; Odoo unused).
    # UPGRADED 2026-09-09 15 -> 16 (sync-core: replication-origin filtering, `origin=none`
    # on pgoutput, is PG16+ and is the planned replacement for the sync_origin row filter).
    # Side-by-side: the 15 cluster stays untouched at data/postgresql for rollback; 16 was
    # restored from a 16-client pg_dump into data/postgresql16 and verified identical
    # (counts, publications + row filters, triggers, strided sequences, roles, extensions).
    image: ${POSTGRES_IMAGE:?}
    # Seed dumps + task 050 connect as the `postgres` superuser (Rawach's PG16
    # dir was a restore that had it). The base inits POSTGRES_USER=${ODOO_DB_USER}
    # (=odoo), so a FRESH clinic has no `postgres` role -> task 050 fails "role
    # postgres does not exist" (first live clinic, manpur). Init `postgres` here;
    # the odoo role + odoo/openelis DBs are made by task 050. Existing nodes are
    # unaffected (POSTGRES_USER is read only on an empty datadir).
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:?}
      POSTGRES_DB: postgres
    volumes: !override
      - '${CONTAINER_DATA_PATH}/data/postgresql16:/var/lib/postgresql/data'
      - '${CONTAINER_DATA_PATH}/files/postgresql:/filestore:ro'
    # Also joins the `openelis` profile: it now hosts the clinlims database too, so
    # `up -d openelis` must be able to bring its own dependency up.
    profiles: ["odoo", "local", "openelis"]
    # 5432 belongs to the host Homebrew Postgres (bahmni_dev / memory_db). Never take it.
    ports: !override
      - '127.0.0.1:5433:5432'
    # Debezium's pgoutput needs logical decoding; the base image ships wal_level=replica.
    # Two slots (odoo + openelis), so headroom above the default 10 is unnecessary but
    # explicit values keep this readable.
    command: >-
      postgres
      -c wal_level=logical
      -c max_replication_slots=10
      -c max_wal_senders=10

  # NEW SERVICE (not in Sushil's compose — the clinic side has never had OpenELIS).
  # Module 28 §3.1. Profile-gated so it never starts by accident; start it by name.
  openelis:
    profiles: ["openelis"]
    image: 'bahmni/openelis:${OPENELIS_IMAGE_TAG:-1.1.0-111}'
    ports:
      - '127.0.0.1:8052:8052'
    # Upstream start.sh dies in liquibase (see openelis/start-no-migrate.sh header).
    command: ['/start-no-migrate.sh']
    volumes:
      # start.sh symlinks /etc/bahmni_config/openelis -> /var/www/bahmni_config/openelis
      # and runs the implementation liquibase from it.
      - './bahmni-config:/etc/bahmni_config:ro'
      - './openelis/start-no-migrate.sh:/start-no-migrate.sh:ro'
    environment:
      TZ: ${TZ}
      # start.sh reads OPENELIS_DB_USERNAME; .env carries OPENELIS_DB_USER.
      OPENELIS_DB_SERVER: ${OPENELIS_DB_SERVER}
      OPENELIS_DB_PORT: ${OPENELIS_DB_PORT}
      OPENELIS_DB_NAME: ${OPENELIS_DB_NAME}
      OPENELIS_DB_USERNAME: ${OPENELIS_DB_USER}
      OPENELIS_DB_PASSWORD: ${OPENELIS_DB_PASSWORD}
      # update_openmrs_host_port.sh rewrites the ELIS-side feed bookmarks to this host.
      OPENMRS_HOST: ${OPENMRS_HOST}
      OPENMRS_PORT: ${OPENMRS_PORT}
      OPENMRS_ATOMFEED_USER: ${OPENMRS_ATOMFEED_USER}
      OPENMRS_ATOMFEED_PASSWORD: ${OPENMRS_ATOMFEED_PASSWORD}
    depends_on:
      bahmni-postgres:
        condition: service_healthy
    restart: ${RESTART_POLICY}

  # Mount an nginx conf that adds the /openelis route. Sushil's proxy/bahmni-nginx.conf
  # is baked into the image and left untouched; this is a copy plus one location block.
  proxy:
    volumes:
      - './proxy/bahmni-nginx.openelis.conf:/etc/nginx/nginx.conf:ro'
      # error_page 500 501 502 -> /internalError.html had no such file, so nginx turned
      # every upstream 500 into a 404. The page lives in proxy/htdocs/ beside
      # maintenance.html and unauthorized.html (the image's COPY ./htdocs/ picks it up on
      # the next build); mounted here so the fix applies without rebuilding the image.
      - './proxy/htdocs/internalError.html:/usr/share/nginx/html/internalError.html:ro'

  # Sushil's `openmrs` service forwards NO OPENELIS_* variables, so
  # bahmnicore.properties.template and update_elis_host_port.sh — both of which
  # interpolate ${OPENELIS_HOST}/${OPENELIS_PORT} — could only ever render
  # "http://:/" no matter what .env said. That is the real shape of BL-048.
  openmrs:
    # F-050 / BL-014. This container had NO memory limit and grew to 5.7 GB of
    # ANONYMOUS memory on Rawach in one day -- cgroup memory.stat read anon 5715
    # MiB against only 7 MiB of file cache -- while OMRS_JAVA_MEMORY_OPTS caps the
    # heap at 2048m and metaspace at 512m. So roughly 3 GB sits OUTSIDE the heap,
    # where the heap cap cannot reach it. The VM was left with 168 MB available
    # and swap fully consumed, which is how the hub's OpenMRS died for three days
    # (BL-069): unbounded, so the kernel took the container rather than the
    # container failing itself.
    #
    # PER NODE, and required: Ghated runs the same image and heap settings at
    # 2.8 GB after FIVE days, so this is not a general leak -- it tracks database
    # size. A shared literal would either kill the larger node on sight or fail to
    # bound the smaller one. Rawach 6g, Ghated 4g, both above measured usage.
    mem_limit: ${OPENMRS_MEM_LIMIT:?}
    environment:
      OPENELIS_HOST: ${OPENELIS_HOST}
      OPENELIS_PORT: ${OPENELIS_PORT}
      OPENELIS_ATOMFEED_USER: ${OPENELIS_ATOMFEED_USER}
      OPENELIS_ATOMFEED_PASSWORD: ${OPENELIS_ATOMFEED_PASSWORD}
    # Form definitions live on DISK; form_resource stores only the PATH. The
    # restored production DB references 133 files under /home/bahmni/clinical_forms
    # while the stock image ships 21, so opening a patient's Observations tab threw
    #   "Unable to read from the file with name
    #    /home/bahmni/clinical_forms/<uuid>.json (No such file or directory)"
    # for Adult Case Sheet and 131 others (observed 2026-08-28).
    #
    # docker-compose.yml:90 carries the mount that would supply them, commented out.
    # Mounting bahmni_home/clinical_forms ONLY, never the whole bahmni_home: the
    # container also has uploaded-files/ and uploaded_results/ under /home/bahmni
    # which the repo tree lacks, and a whole-directory mount would shadow them.
    #
    # Scope, measured: of the 136 references, 111 belong to RETIRED forms using
    # the pre-UUID naming convention (…/Adult_Case_Sheet_1.json). Those files
    # exist nowhere — not here, not in the repo, and not on the IPlet staging box
    # bhs-sandbox.bahmni.in, checked directly (381 form files there, a superset of
    # this repo's 370). Retired forms are never rendered, so that is correct, not
    # a gap. All 25 references belonging to ACTIVE forms now resolve: 25/25
    # present, 0 missing.
    #
    # Read-write on purpose: the implementer-interface writes new and edited forms
    # here, so authored forms land in the repo working tree (and show up in
    # `git status`) instead of vanishing with the container. :ro would break form
    # authoring.
    volumes:
      - "${CONTAINER_DATA_PATH:?}/bahmni_home/clinical_forms:/home/bahmni/clinical_forms"
  # ODOO — ADDED 2026-09-02 (operator decision: "replicate cloud odoo as same
  # to clinic ... use same pipeline we used to sync mrs and elis").
  #
  # REMOVED 2026-09-17 (sync-core Task 4): the odoo-10 override (this comment's
  # own former justification -- BHS/cloud ran Odoo 10, so a 16-vs-10 clinic
  # could never sync with it) is gone because staging (bhs-sandbox.bahmni.in,
  # read 2026-09-17) runs bahmni/odoo-16:1.0.0, not odoo-10 -- the premise
  # flipped. The base compose's own `odoo` service (image ${ODOO_IMAGE_NAME},
  # HOST ${ODOO_DB_HOST} = bahmni-postgres) now runs unmodified, and the
  # private `odoodb` service + its volume are deleted with it: Odoo 16 lives on
  # the shared bahmni-postgres like OpenELIS always has, with its own
  # publication/slot (dbz_odoo_owned) controlled independently there, same as
  # before -- just without a second Postgres instance to get it.
  odoo-connect:
    logging: *rotate
    # Silences the image's root-DEBUG logback, whose CONSOLE appender has no
    # rolling policy and so writes straight into the container's json.log. With
    # org.apache.http.wire at DEBUG that is every HTTP header of every ATOM feed
    # poll: 3,857 MB in about three hours on Rawach, the largest single consumer
    # of a 58 GB VM disk, twice in one day. Rotation bounds the damage; this
    # bounds the cause.
    volumes:
      - '${CONTAINER_DATA_PATH:?}/odoo/logback-erp-connect.xml:/run/bahmni-erp-connect/bahmni-erp-connect/WEB-INF/classes/logback.xml:ro'
      # Apache HttpClient 5, which the image needs and does not ship (sync-core
      # F-064). openerp-client's XMLClient.setTimeout builds Spring 6's
      # HttpComponentsClientHttpRequestFactory, compiled against HttpClient 5
      # (org.apache.hc.*), while the WAR carries only HttpClient 4.5.13 -- so the
      # call throws NoClassDefFoundError on EVERY Odoo XML-RPC request. Upstream
      # swallows it (catch Throwable, log), so customers are still written: the
      # cost is a 30-line stack trace per event -- 336 a minute on Rawach on
      # 2026-09-15. These jars stop that; they do NOT restore the configured
      # reply timeout, which was never applied and still is not: Spring 6.0's
      # setReadTimeout on this factory is a no-op and logs "has no effect"
      # once. A hung Odoo still stalls the feed worker. Versions are the ones Spring Boot
      # 3.0.13's BOM manages for this spring-web (6.0.19); the SHA-1s in
      # odoo/erp-connect-lib/SHA1SUMS match Maven Central. Still unfixed on
      # upstream master as of 2026-03-04 (openerp-client/pom.xml declares
      # httpclient 4 only), so this stays until an image ships the jars.
      # A missing source file would make the engine create an empty DIRECTORY
      # of that name inside WEB-INF/lib and the fix would silently not apply;
      # scripts/preflight.sh checks the jar is a file and the error is gone.
      - '${CONTAINER_DATA_PATH:?}/odoo/erp-connect-lib/httpclient5-5.1.4.jar:/run/bahmni-erp-connect/bahmni-erp-connect/WEB-INF/lib/httpclient5-5.1.4.jar:ro'
      - '${CONTAINER_DATA_PATH:?}/odoo/erp-connect-lib/httpcore5-5.1.5.jar:/run/bahmni-erp-connect/bahmni-erp-connect/WEB-INF/lib/httpcore5-5.1.5.jar:ro'
      - '${CONTAINER_DATA_PATH:?}/odoo/erp-connect-lib/httpcore5-h2-5.1.5.jar:/run/bahmni-erp-connect/bahmni-erp-connect/WEB-INF/lib/httpcore5-h2-5.1.5.jar:ro'
    profiles: ["odoo","local"]
    image: 'bahmni/odoo-connect:${ODOO_CONNECT_IMAGE_TAG}'
    platform: linux/amd64
    # Reads THIS clinic's own feeds over the container network. Nothing here
    # crosses a node boundary, which is what keeps the clinic working with the
    # uplink cut (draft policy P-05).
    environment:
      # ODOO_DB_SERVER pointed at the private odoodb service; that service is gone
      # (sync-core Task 4, 2026-09-17) and Odoo 16 lives on the shared bahmni-postgres,
      # so this now names that instead. The base compose's own odoo service already
      # points HOST at ${ODOO_DB_HOST} = bahmni-postgres; this is odoo-connect's own,
      # differently-named variable for the same host.
      ODOO_DB_SERVER: bahmni-postgres
      ODOO_DB_USERNAME: ${ODOO_DB_USER}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD}
      OPENMRS_HOST: ${OPENMRS_HOST}
      OPENMRS_PORT: ${OPENMRS_PORT}
      OPENMRS_ATOMFEED_USER: ${OPENMRS_ATOMFEED_USER}
      OPENMRS_ATOMFEED_PASSWORD: ${OPENMRS_ATOMFEED_PASSWORD}
      OPENELIS_HOST: ${OPENELIS_HOST}
      OPENELIS_PORT: ${OPENELIS_PORT}
      OPENELIS_ATOMFEED_USER: ${OPENELIS_ATOMFEED_USER}
      OPENELIS_ATOMFEED_PASSWORD: ${OPENELIS_ATOMFEED_PASSWORD}
      ODOO_HOST: ${ODOO_HOST}
      ODOO_PORT: ${ODOO_PORT}
      ODOO_ATOMFEED_USER: ${ODOO_ATOMFEED_USER}
      ODOO_ATOMFEED_PASSWORD: ${ODOO_ATOMFEED_PASSWORD}
    depends_on:
      bahmni-postgres:
        condition: service_healthy
    restart: ${RESTART_POLICY}
# The odoodb-data / odooapp-data named-volume block that used to live here is gone
# (sync-core Task 4, 2026-09-17): odoodb no longer exists, and odoo's data now
# rides the base compose's own bind mount under CONTAINER_DATA_PATH, same as the
# rest of the clinic's services. ODOO_DB_VOLUME_NAME / ODOO_APP_VOLUME_NAME are
# still rendered into clinic/.env by task 020 (unused, harmless); not touched
# here since only the compose side was in this task's scope.
