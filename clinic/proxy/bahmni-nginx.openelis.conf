user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # WebSocket support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # reporting_session will be derived per-request inside server block

    # Optional simple proxy cache (can be tuned/disabled as needed)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=1d max_size=2g;

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Default HTTPS vhost
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/tls/cert.pem;
        ssl_certificate_key /etc/tls/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;
        http2 on;

        # Security and behavior parity
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;

        proxy_intercept_errors on;
        # `=500` (not a bare `=`) PINS the status. With the bare form nginx takes the
        # status from the target, and internalError.html did not exist — so every upstream
        # 500 was served to the client as 404, which reads as "missing page" and sends you
        # looking for a routing bug instead of an application error. The page itself is
        # mounted from proxy/htdocs/ (see docker-compose.override.yml).
        error_page 500 501 502 =500 /internalError.html;

        root /usr/share/nginx/html;

        # Server-wide relative redirects. nginx builds absolute Location headers from the
        # port it LISTENS on (443); this container is published on the host as 9443, which
        # nginx cannot know, so the port is dropped as "default for https" and every
        # directory redirect (/bahmni/clinical -> /bahmni/clinical/) lands on
        # https://localhost/ with nothing serving it. The /lab block below already carries
        # this directive for the same reason; scoping it there left every other path --
        # including the static /bahmni apps served straight off `root` -- still broken.
        # Relative Locations are also correct on the tailnet host and in production.
        absolute_redirect off;

        # Maintenance mode (checks presence of files like Apache conf)
        set $maintenance 0;
        if (-f /usr/share/nginx/html/maintenance.enable) { set $maintenance 1; }
        if ($remote_addr = 123.456.789.000) { set $maintenance 0; }
        if ($maintenance = 1) { return 503; }
        error_page 503 /maintenance.html;

        # Mirror Apache's cookie injection for reporting_session
        set $reporting_session "";
        if ($http_cookie ~* "JSESSIONID=([^;]+)") {
            set $reporting_session $1;
        }
        add_header Set-Cookie "reporting_session=$reporting_session; Domain=$host; Max-Age=86400; Path=/; Secure; HttpOnly" always;

        # Common proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # System Date CGI (proxied to Python service)
        location /cgi-bin/systemdate {
            proxy_pass http://systemdate:8765;
        }

        # Log endpoint - returns empty 200
        location /log {
            return 200 '';
        }

        # Patient Documents
        location /document_images {
            proxy_pass http://patient-documents/document_images;
        }
        location /uploaded_results {
            proxy_pass http://patient-documents/uploaded_results;
        }
        location /openmrs/auth {
            proxy_pass http://patient-documents/openmrs/auth;
        }

        # Appointments
        # location /appointments {
        #     proxy_pass http://appointments/appointments;
        # }

        # OpenMRS
        location /openmrs {
            proxy_pass http://openmrs:8080/openmrs;
        }

        # Bahmni Web
        # location /bahmni {
        #     proxy_pass http://bahmni-web:8091/bahmni;
        # }
        # location /bahmni_config {
        #     proxy_pass http://bahmni-web:8091/bahmni_config;
        # }

        # Implementer Interface
        location /implementer-interface {
            proxy_pass http://implementer-interface/implementer-interface;
        }

        # Bahmni Lab
        location /lab {
            proxy_pass http://bahmni-lab/lab;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # The upstream answers /lab with an ABSOLUTE 301 and drops the port itself:
            # Host "localhost:9443" still yields "http://localhost/lab/", so the home
            # page's Lab tile landed on the wrong origin. Setting Host alone does NOT fix
            # it (verified). Two directives are needed, and BOTH are load-bearing:
            #
            #   proxy_redirect     rewrites the upstream's absolute Location to a relative
            #                      one (this is also what corrects the http:// scheme).
            #   absolute_redirect  keeps it relative. Without it nginx re-absolutises the
            #                      Location on the way out using the port it LISTENS on
            #                      (443) — but this container is published on the host as
            #                      9443, which nginx cannot know. The port is therefore
            #                      dropped as "default for https" and the link breaks
            #                      again. Any published-port != listen-port mapping hits
            #                      this; it is invisible when the two happen to match.
            #
            # Relative Locations also keep this correct on the tailnet host and in
            # production without templating a single URL from .env.
            proxy_redirect ~^https?://[^/]+(/lab.*)$ $1;
            absolute_redirect off;
        }

        # Bahmni Reports
        # location /bahmnireports {
        #     proxy_pass http://reports:8051/bahmnireports;
        # }

        # DCM4CHEE + Oviyam2
        location /dcm4chee-web3 {
            resolver 127.0.0.1 valid=30s;
            set $dcm4chee_host dcm4chee;
            proxy_pass http://$dcm4chee_host:8055/dcm4chee-web3;
        }
        location /oviyam2 {
            resolver 127.0.0.1 valid=30s;
            set $dcm4chee_host dcm4chee;
            proxy_pass http://$dcm4chee_host:8055/oviyam2;
        }

        # OpenELIS  (ADDED — Module 28; not in Sushil's conf)
        # Uses resolver 127.0.0.11 (Docker's embedded DNS) rather than the 127.0.0.1
        # the neighbouring optional routes use: 127.0.0.1 does not resolve container
        # names, which is BL-008, and is why /atomfeed-console returns HTTP 000 today.
        location /openelis {
            # PORTABILITY (2026-09-02): resolver 127.0.0.11 is DOCKERs embedded DNS
            # and does not exist under podman, whose resolver is 10.89.x.1. Clinic 2
            # runs podman, so the variable form failed there with
            #   send() failed (111: Connection refused) while resolving, resolver: 127.0.0.11:53
            # and every /openelis request 499d. Name resolution itself was fine
            # (getent hosts openelis resolved), only the hardcoded resolver was wrong.
            # A literal upstream resolves at config-load time from /etc/resolv.conf and
            # so works on BOTH runtimes with no resolver directive at all.
            # Caveat: nginx then caches the IP, so reload the proxy after recreating
            # the openelis container.
            # NO URI part: with a variable in proxy_pass, an explicit URI REPLACES the
            # whole path instead of just the matched prefix, so upstream always saw
            # "/openelis" and the app's 302 to "/openelis/" looped forever. Without it
            # nginx forwards the request URI unchanged. (Sushil's dcm4chee/oviyam2/
            # atomfeed-console routes use the variable+URI form and share this latent bug.)
            proxy_pass http://openelis:8052;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Atomfeed-console
        location /atomfeed-console {
            resolver 127.0.0.1 valid=30s;
            set $atomfeed_console_host atomfeed-console;
            proxy_pass http://$atomfeed_console_host:9080/atomfeed-console;
        }

        # Metabase
        location /metabase {
            resolver 127.0.0.1 valid=30s;
            set $metabase_host metabase;
            proxy_pass http://$metabase_host:3000;
        }

        # Grafana (WebSocket)
        # location /grafana {
        #     proxy_pass http://grafana:3000;
        # }

        # SMS Service
        location /sms-service {
            resolver 127.0.0.1 valid=30s;
            set $sms_service_host sms-service;
            proxy_pass http://$sms_service_host:8080;
        }

        # Generic WebSocket routing to vakyansh-proxy (parity with Apache rewrite)
        # error_page 418 = @ws_vakyansh;
        # if ($http_upgrade ~* websocket) { return 418; }
        # location @ws_vakyansh {
        #     proxy_pass http://vakyansh-proxy:9009;
        # }
    }

    # ------------------------------------------------------------------
    # Odoo, served at ROOT on its own TLS port (published on the host as 9444).
    #
    # Odoo cannot be served under a sub-path: it emits absolute URLs (/web,
    # /web/static/..., /longpolling/...) that a /odoo prefix breaks -- the login
    # page renders and every asset 404s. The cloud hub reaches the same conclusion
    # independently: both of its mechanisms (the odoo.<domain> vhost and the erp-*
    # host rewrite) serve Odoo at root, never on a path.
    # ------------------------------------------------------------------
    server {
        listen 444 ssl;
        server_name _;

        ssl_certificate     /etc/tls/cert.pem;
        ssl_certificate_key /etc/tls/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;
        http2 on;

        add_header X-Robots-Tag "noindex, nofollow" always;

        # Same trap as the 443 vhost: nginx builds absolute Location headers from the
        # port it LISTENS on (444), while the container is published on 9444. Without
        # this every Odoo redirect loses the port and lands where nothing serves.
        absolute_redirect off;

        # Odoo builds absolute Location headers from the Host header it receives.
        # MEASURED: with Host=$http_host it already emits the correct host AND port
        # (http://localhost:9444/web/...); the only wrong part is the scheme, because
        # Odoo 10 ignores X-Forwarded-Proto unless proxy_mode=True is set in odoo.conf.
        # So rewrite the scheme only and leave host:port untouched.
        proxy_redirect ~^http://([^/]+)(/.*)$ https://$1$2;

        client_max_body_size 128M;

        # $http_host (not $host) keeps the client's port, so Odoo builds URLs that
        # point back at 9444 rather than the default https port.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # MEASURED: this Odoo runs with workers unset (=0), so it listens ONLY on 8069
        # and serves /longpolling from the same process. Routing /longpolling to 8071
        # returns 502 -- 8071 is exposed by the image but nothing binds it.

        location / {
            proxy_pass http://odoo:8069;
            proxy_read_timeout 720s;
        }
    }
}
