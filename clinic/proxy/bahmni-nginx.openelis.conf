user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # Re-resolved upstreams: a literal name is resolved once, so a restarted app container's new address would be missed until reload.
    # clinic-resolver.conf is written at start by 05-clinic-resolver.sh from this container's resolv.conf.
    include /etc/nginx/clinic-resolver.conf;
    upstream openmrs_app  { zone openmrs_app 64k;  server openmrs:8080 resolve; }
    upstream openelis_app { zone openelis_app 64k; server openelis:8052 resolve; }
    upstream odoo_app     { zone odoo_app 64k;     server odoo:8069 resolve; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # `&lt;=` only in the UI's form-render read, `<=` everywhere else; see the form definition route.
    map $args $form_script_le {
        "~^v=custom(?::|%3[Aa])(?:\(|%28)resources(?::|%3[Aa])(?:\(|%28)value(?:\)|%29)(?:\)|%29)$" "&lt;=";
        default "<=";
    }

    # Master data comes down from the hub, so any method but GET, HEAD and OPTIONS on a path that writes it gets 403.
    # Paths match whole segments; `;` and `.` end one too, as OpenMRS ignores `;jsessionid=...` and serves `x.json` as `x`.
    map $request_method $master_write_method {
        GET     0;
        HEAD    0;
        OPTIONS 0;
        default 1;
    }
    map $uri $master_path {
        default 0;
        "~*^/openmrs/ws/rest/v1/(?:concept|conceptclass|conceptsource|conceptreferenceterm|conceptreferencetermmap|conceptattributetype|conceptdatatype|conceptmaptype|drug|drugreferencemap|location|locationtag|locationattributetype|program|workflow|programattributetype|visittype|visitattributetype|ordertype|orderfrequency|personattributetype|relationshiptype|providerattributetype|encounterrole|patientidentifiertype|privilege|role|form|metadatamapping|openconceptlab)(?:[/;.]|$)" 1;
        "~*^/openmrs/(?:ws|ms|moduleServlet)/(?:fhir2/)?fhir2[A-Za-z0-9]*(?:/R[34])?/(?:Location|Medication)(?:[/;.]|$)" 1;
        # Printing a filled form is not authoring; keep it above the form rule, as the first matching regex wins.
        "~*^/openmrs/ws/rest/v1/bahmniie/form/jsonToPdf(?:[/;.]|$)" 0;
        "~*^/openmrs/ws/rest/v1/bahmniie/form(?:[/;.]|$)" 1;
        "~*^/openmrs/ws/rest/v1/bahmnicore/admin/upload/(?:concept|conceptset|drug|referenceterms)(?:[/;.]|$)" 1;
        "~*^/openmrs/ws/rest/v1/reference-data(?:[/;.]|$)" 1;
        "~*^/openmrs/ws/rest/v1/bahmnicore/distro/(?:location|locationOnBoarding|addConceptAnswer)(?:[/;.]|$)" 1;
        "~*^/openmrs/dictionary/" 1;
        "~*^/openmrs/admin/(?:concepts|forms)/" 1;
        "~*^/openmrs/admin/locations/location" 1;
        "~*^/openmrs/admin/programs/(?:program|workflow|conversion)\." 1;
        "~*^/openmrs/admin/visits/visit(?:Type|AttributeType)" 1;
        "~*^/openmrs/admin/person/(?:relationshipType|personAttributeType)" 1;
        "~*^/openmrs/admin/patients/patientIdentifierType" 1;
        "~*^/openmrs/admin/users/(?:role|privilege)\." 1;
        "~*^/openmrs/admin/encounters/encounterRole" 1;
        "~*^/openmrs/admin/provider/providerAttributeType" 1;
        "~*^/openmrs/module/(?:metadatasharing/import|metadatamapping)/" 1;
    }
    map "$master_write_method$master_path" $master_write_refused {
        11      1;
        default 0;
    }
    log_format master_write_refused '$remote_addr [$time_local] "$request" $status master data write refused: master data is maintained at the hub';

    # The lab catalogue comes from the hub (a local row can block the hub's on a unique name); these Struts actions save on a GET too, so any method gets 403.
    # `;` ends the action name, as Tomcat keeps `;jsessionid=...` in the path.
    map $uri $catalogue_write_refused {
        default 0;
        "~*^/openelis/(?:Update|UpdateNextPrevious|Delete)(?:Test|TestSection|Panel|PanelItem|TypeOfSample|TypeOfSampleTest|TypeOfSamplePanel|TestResult|TestAnalyte|TestAnalyteTestResult|TestReflex|TestTrailer|Analyte|Dictionary|DictionaryCategory|Label|Method|Scriptlet|UnitOfMeasure|TypeOfTestResult|ResultLimits|Organization)\.do(?:;|$)" 1;
    }
    log_format catalogue_write_refused '$remote_addr [$time_local] "$request" $status lab test catalogue write refused: the catalogue is maintained at the hub';

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=1d max_size=2g;

    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/tls/cert.pem;
        ssl_certificate_key /etc/tls/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;
        http2 on;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;

        proxy_intercept_errors on;
        # `=500`, not a bare `=`: the bare form answers with the error page's own status (a 404 if it is missing), hiding the 500.
        error_page 500 501 502 =500 /internalError.html;

        root /usr/share/nginx/html;

        # Relative redirects: an absolute Location carries the listen port (443), wrong when the host publishes another port.
        absolute_redirect off;

        set $maintenance 0;
        if (-f /usr/share/nginx/html/maintenance.enable) { set $maintenance 1; }
        if ($remote_addr = 123.456.789.000) { set $maintenance 0; }
        if ($maintenance = 1) { return 503; }
        error_page 503 /maintenance.html;

        # At server level, before a location is chosen, so every route refuses alike, the form definition regex included.
        if ($master_write_refused) { rewrite ^ /master-write-refused last; }
        if ($catalogue_write_refused) { rewrite ^ /catalogue-write-refused last; }
        location = /master-write-refused {
            internal;
            access_log /var/log/nginx/access.log master_write_refused;
            default_type text/plain;
            return 403 "Master data is maintained at the hub; this change is refused at this clinic\n";
        }
        location = /catalogue-write-refused {
            internal;
            access_log /var/log/nginx/access.log catalogue_write_refused;
            default_type text/plain;
            return 403 "The lab test catalogue is maintained at the hub; this change is refused at this clinic\n";
        }

        set $reporting_session "";
        if ($http_cookie ~* "JSESSIONID=([^;]+)") {
            set $reporting_session $1;
        }
        add_header Set-Cookie "reporting_session=$reporting_session; Domain=$host; Max-Age=86400; Path=/; Secure; HttpOnly" always;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location /cgi-bin/systemdate {
            proxy_pass http://systemdate:8765;
        }

        location /log {
            return 200 '';
        }

        location /document_images {
            proxy_pass http://patient-documents/document_images;
        }
        location /uploaded_results {
            proxy_pass http://patient-documents/uploaded_results;
        }
        location /openmrs/auth {
            proxy_pass http://patient-documents/openmrs/auth;
        }

        # Stopgap: the pinned UI POSTs patient search, which the module serves on GET only; every parameter is in the query string.
        location = /openmrs/ws/rest/v1/bahmnicore/distro/patient/search {
            proxy_method GET;
            proxy_pass http://openmrs_app;
        }

        # The module serves only /findWith and /createDrugOrder here; every other encounter call goes to the stock controller.
        location = /openmrs/ws/rest/v1/bahmnicore/distro/bahmniencounter/findWith {
            proxy_pass http://openmrs_app;
        }
        location = /openmrs/ws/rest/v1/bahmnicore/distro/bahmniencounter/createDrugOrder {
            proxy_pass http://openmrs_app;
        }
        location ^~ /openmrs/ws/rest/v1/bahmnicore/distro/bahmniencounter {
            rewrite ^/openmrs/ws/rest/v1/bahmnicore/distro/bahmniencounter(.*)$ /openmrs/ws/rest/v1/bahmnicore/bahmniencounter$1 break;
            proxy_pass http://openmrs_app;
        }

        # Stopgap: nothing in the pinned OpenMRS serves conditionhistory and its error object stops the dashboard; an empty list opens it.
        location = /openmrs/ws/rest/emrapi/conditionhistory {
            default_type application/json;
            return 200 '[]';
        }

        # Stopgap: the module's translations directory is missing in the pinned image, so a 500 becomes the empty list the UI renders with.
        # A location that sets error_page inherits none from the server, so the server's are repeated.
        location = /openmrs/ws/rest/v1/bahmniie/form/translations {
            error_page 500 = @no_form_translations;
            error_page 501 502 =500 /internalError.html;
            error_page 503 /maintenance.html;
            proxy_pass http://openmrs_app;
        }
        location @no_form_translations {
            default_type application/json;
            return 200 '[]';
        }

        # Stopgap: the pinned UI HTML-parses form event scripts, so `<=` cuts them; the render read gets `&lt;=`, which the parser decodes.
        # sub_filter needs an uncompressed body, and a location that sets a header inherits none, so the server's are repeated.
        location ~ ^/openmrs/ws/rest/v1/form/[0-9a-fA-F-]+$ {
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding   "";
            sub_filter_types application/json;
            sub_filter_once off;
            sub_filter '<=' $form_script_le;
            proxy_pass http://openmrs_app;
        }

        location /openmrs {
            # Stopgap: the pinned UI asks roles with `person:(uuid,)`, which OpenMRS REST answers 400; drop a comma before `)`, twice for two.
            # `set` is the one directive that is safe inside `if`.
            if ($args ~* "^(.*)(?:,|%2C)(\)|%29)(.*)$") { set $args "$1$2$3"; }
            if ($args ~* "^(.*)(?:,|%2C)(\)|%29)(.*)$") { set $args "$1$2$3"; }
            proxy_pass http://openmrs_app/openmrs;
        }

        # A variable, so the proxy starts without the form builder (502 until it runs); no URI part, which a variable would make replace the path.
        location /implementer-interface {
            set $implementer_interface_host implementer-interface;
            proxy_pass http://$implementer_interface_host;
        }

        location /lab {
            proxy_pass http://bahmni-lab/lab;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # The upstream's 301 is absolute http:// without the port: proxy_redirect makes it relative, absolute_redirect keeps it so.
            proxy_redirect ~^https?://[^/]+(/lab.*)$ $1;
            absolute_redirect off;
        }

        location /dcm4chee-web3 {
            resolver 127.0.0.1 valid=30s;
            set $dcm4chee_host dcm4chee;
            proxy_pass http://$dcm4chee_host:8055/dcm4chee-web3;
        }
        location /oviyam2 {
            resolver 127.0.0.1 valid=30s;
            set $dcm4chee_host dcm4chee;
            proxy_pass http://$dcm4chee_host:8055/oviyam2;
        }

        location /openelis {
            # The re-resolved upstream, not a variable: a hard-coded resolver differs between container runtimes.
            proxy_pass http://openelis_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /atomfeed-console {
            resolver 127.0.0.1 valid=30s;
            set $atomfeed_console_host atomfeed-console;
            proxy_pass http://$atomfeed_console_host:9080/atomfeed-console;
        }

        location /metabase {
            resolver 127.0.0.1 valid=30s;
            set $metabase_host metabase;
            proxy_pass http://$metabase_host:3000;
        }

        location /sms-service {
            resolver 127.0.0.1 valid=30s;
            set $sms_service_host sms-service;
            proxy_pass http://$sms_service_host:8080;
        }
    }

    # Odoo at the root of its own name (odoo.<clinic name>): it emits absolute URLs, so it cannot live under a sub-path.
    server {
        listen 443 ssl;
        server_name ~^odoo\.;

        ssl_certificate     /etc/tls/cert.pem;
        ssl_certificate_key /etc/tls/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;
        http2 on;

        add_header X-Robots-Tag "noindex, nofollow" always;

        # Redirects stay relative, so they keep whatever name the client used.
        absolute_redirect off;

        # Odoo builds Location from the Host it gets; only the scheme is wrong behind TLS, so only it is rewritten.
        proxy_redirect ~^http://([^/]+)(/.*)$ https://$1$2;

        client_max_body_size 128M;

        # $http_host keeps the name the client used, so Odoo's own URLs point back at it.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # No /longpolling route to 8071: with workers unset Odoo serves it on 8069, and nothing binds 8071.
        location / {
            proxy_pass http://odoo_app;
            proxy_read_timeout 720s;
        }
    }
}
