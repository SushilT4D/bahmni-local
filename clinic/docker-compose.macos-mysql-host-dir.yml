# macOS: a MySQL database created on a case-insensitive macOS directory records lower_case_table_names=2,
# which the machine-disk volume refuses, so it stays in that directory (MYSQL_HOST_DATA_DIR).
# Selected by listing this file after docker-compose.macos.yml in COMPOSE_FILE in clinic/.env.
services:
  bahmni-mysql:
    volumes: !override
      - '${MYSQL_HOST_DATA_DIR:?MYSQL_HOST_DATA_DIR names the host directory of a database created there}:/var/lib/mysql'
      - '${CONTAINER_DATA_PATH}/data/configuration_checksums:/configuration_checksums'
      - '${CONTAINER_DATA_PATH}/config/mysql/sync-tuning.cnf:/etc/mysql/conf.d/sync-tuning.cnf:ro'
