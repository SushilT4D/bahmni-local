# macOS only, selected through COMPOSE_FILE in clinic/.env: the databases stay on the podman
# machine's own disk, because virtiofs bind mounts are not POSIX and crash PostgreSQL's logical decoding.
services:
  bahmni-postgres:
    volumes: !override
      - 'pgdata:/var/lib/postgresql/data'
      - '${CONTAINER_DATA_PATH}/files/postgresql:/filestore:ro'
  bahmni-mysql:
    volumes: !override
      - 'mysqldata:/var/lib/mysql'
      - '${CONTAINER_DATA_PATH}/data/configuration_checksums:/configuration_checksums'
      - '${CONTAINER_DATA_PATH}/config/mysql/sync-tuning.cnf:/etc/mysql/conf.d/sync-tuning.cnf:ro'
volumes:
  pgdata:
  mysqldata:
