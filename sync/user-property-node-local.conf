# user_property names that hold one node's own state, not a setting of the
# user: what this user last looked at here, how often a login failed here, when
# the account was locked here, a password-reset key issued here. A clinic that
# receives the hub's staff users (role `hub-written` in the clinic's down list,
# clinic/scripts/generate-local-sink-connectors.sh) never takes these from the
# hub: the hub's values would overwrite the clinic's, and a lockout at the hub
# would lock the user out at the clinic. Every other property name the hub's
# own users carry is a setting and comes down.
#
# Read by clinic/scripts/generate-local-sink-connectors.sh (it refuses a kept
# name listed here) and clinic/scripts/clinic-minted-staff.sh (it leaves these
# out of the names it keeps and out of the rows it loads). One name per line.
lastViewedPatients
recentlyViewedPatients
loginAttempts
lockoutTimestamp
lastLoginTimestamp
activationKey
