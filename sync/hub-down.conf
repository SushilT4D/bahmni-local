# Tables the hub sends DOWN to clinics, outside OpenMRS.
# Format:  <subsystem>:<table>                  Odoo: to every clinic
#          <subsystem>:<table>:clinic=<column>  OpenELIS lab rows: to the clinic <column> names
#
# The clinic sends all of sync/subsystems.conf UP. The hub sends down only the
# tables below. Everything else in sync/subsystems.conf is up-only:
#
#   - Partners, invoices, sales and stock levels (res_partner,
#     res_partner_attributes, sale_order, sale_order_line, account_move,
#     account_move_line, stock_quant) belong to the clinic that wrote them. A hub write that touches one, by a person or by
#     software such as the OpenMRS-to-Odoo feed, would otherwise reach every
#     clinic: another clinic's patient on each of them, and a sale or invoice
#     whose partner exists on only one clinic, which stops the down sink of every
#     other clinic on a foreign key it can never satisfy.
#   - Every OpenELIS table except the lab test catalogue and the four lab rows
#     at the end of this file. Samples, patients and signatures are written at
#     the clinics.
#
# Everything that sends tables down is rendered from this list: the hub's Odoo
# publication (dbz_odoo_owned) and OpenELIS publication (dbz_clinlims_owned),
# each hub source's table.include.list and aggregate regex, the clinic
# MirrorMaker's down topics and the clinic's OpenELIS down filter.
# sync/hub-down.sh is the one reader; it refuses a table that is not a synced
# table, and refuses by name every up-only table, so none of them can be added
# here by mistake.
#
# Odoo tables with an `id` column that clinics also mint, and OpenELIS rows with
# no clinic=<column> that have an `id` column, carry a row filter in the
# publication, (id < <floor> OR id % 10 = 0): legacy rows below the hub's
# floor and rows the hub minted itself. The floors are per hub, recorded once:
# for Odoo by the run that strides the hub's ids (hub/scripts/stride-odoo.sh,
# which writes hub/odoo-down-floors.local), for OpenELIS just before the hub's
# OpenELIS ids are strided (hub/scripts/record-clinlims-down-floors.sh, which
# writes hub/clinlims-down-floors.local). A table without `id` (a link table)
# carries no filter.

odoo:product_template
odoo:product_product
odoo:product_category
odoo:uom_uom
odoo:res_country_state
odoo:state_district
odoo:district_subdistrict
odoo:village_village
odoo:product_taxes_rel
odoo:product_supplier_taxes_rel
odoo:stock_route_product

# Stock transfers from a central warehouse, and what they point to. The hub
# writes a transfer (stock_picking with its stock_move and stock_move_line
# rows); the row filter below sends only the hub's own rows, so a transfer a
# clinic wrote stays at the hub. The receiving clinic completes the transfer
# and its change goes up. Each transfer row is written first by the hub, then by
# the clinic, never by both at once. Stock levels (stock_quant) stay up-only:
# each node keeps the quantities of its own locations, and a transfer passes
# through a location that keeps none.
odoo:stock_location
odoo:stock_warehouse
odoo:stock_picking_type
odoo:stock_route
odoo:stock_rule
odoo:procurement_group
odoo:stock_lot
odoo:stock_warehouse_orderpoint
odoo:stock_picking
odoo:stock_move
odoo:stock_move_line

# Lab results entered at the hub for a clinic's sample. A clinic collects a
# sample and sends it, with its analyses, up; an outside lab's result for it is
# entered in the hub's OpenELIS against the clinic's analysis. The hub writes
# the result row and moves the analysis (and, if OpenELIS does, the sample) on
# to its next status; the clinic created those rows, the hub completes them,
# and each row is written by one node at a time.
#
# These rows carry no row filter in the publication: the analysis and sample
# keep the clinic's ids, which the Odoo floor filter would drop. Authorship is
# decided by replication origin instead: the hub's source decodes with
# origin=none, so a row a clinic's up-sink applied at the hub (tagged with that
# clinic's origin) is never published, and only what a hub session wrote goes
# down. Every clinic receives these rows; each keeps only the rows whose
# <column> holds an id it minted: at or above its floor for the table that
# column names, and on its residue (the clinic's OpenELIS down filter). A
# result's own id is the hub's, so it is routed by the analysis it answers.
#
# The lab accounts go to every clinic. A sample the hub moves on carries the
# account of the hub lab user who did it (sample.sys_user_id, a foreign key to
# system_user); without that account at the clinic, the clinic's ordered
# OpenELIS down sink would stop on the first such sample. Like an Odoo master
# row, the publication sends only the hub's own accounts: below its floor
# (hub/clinlims-down-floors.local, recorded when the hub's OpenELIS ids were
# strided) or ending in 0. Listed first: the hub creates an account before it
# writes anything that names it.
clinlims:system_user
clinlims:result:clinic=analysis_id
clinlims:analysis:clinic=id
clinlims:sample:clinic=id

# The lab test catalogue: what a lab test, a panel, a sample type, a department
# and a result option are made of in OpenELIS, and every table those rows point
# to by a foreign key. The hub is its only writer: a test is saved at the hub
# (in OpenMRS, whose concept rows come down through hub/tables.conf), the hub's
# OpenELIS builds its catalogue rows from it, and those rows come down here to
# every clinic, so a clinic's lab knows a test the clinic's doctor can order.
# No clinic sends any of them up (none is in sync/subsystems.conf, and
# sync/hub-down.sh refuses one that is), so every catalogue row at the hub is
# the hub's: below its floor (rows from before its ids were strided) or ending
# in 0. Each table with an `id` carries the floor filter all the same; the two
# without one (organization_organization_type, keyed by its pair of ids, and
# org_mls_lab_type, keyed by org_mlt_id) carry none.
#
# Parents are listed before their children, in foreign-key order. The order of
# this list does not order delivery: every row travels on one ordered stream in
# the order the hub wrote it, and the hub's own foreign keys make it write a
# parent before a child.
clinlims:scriptlet
clinlims:label
clinlims:method
clinlims:test_formats
clinlims:test_trailer
clinlims:type_of_test_result
clinlims:org_mls_lab_type
clinlims:organization
clinlims:organization_type
clinlims:organization_organization_type
clinlims:dictionary_category
clinlims:dictionary
clinlims:unit_of_measure
clinlims:test_section
clinlims:type_of_sample
clinlims:analyte
clinlims:test
clinlims:test_result
clinlims:test_analyte
clinlims:result_limits
clinlims:panel
clinlims:panel_item
clinlims:sampletype_test
clinlims:sampletype_panel
