# Tables the hub sends DOWN to clinics, outside OpenMRS.
# Format:  <subsystem>:<table>
#
# The clinic sends all of sync/subsystems.conf UP. The hub sends down only the
# master and reference tables below: the rows every clinic shares and the hub
# maintains. Everything else in sync/subsystems.conf is up-only:
#
#   - Partners, invoices, sales and stock levels (res_partner,
#     res_partner_attributes, sale_order, sale_order_line, account_move,
#     account_move_line, stock_quant) belong to the clinic that wrote them. A hub write that touches one, by a person or by
#     software such as the OpenMRS-to-Odoo feed, would otherwise reach every
#     clinic: another clinic's patient on each of them, and a sale or invoice
#     whose partner exists on only one clinic, which stops the down sink of every
#     other clinic on a foreign key it can never satisfy.
#   - No OpenELIS table goes down. Lab work happens at the clinics, so the hub
#     authors no OpenELIS rows, and the hub has no OpenELIS down source.
#
# Everything that sends tables down is rendered from this list: the hub's Odoo
# publication (dbz_odoo_owned), the hub Odoo source's table.include.list and
# aggregate regex, and the clinic MirrorMaker's down topics. sync/hub-down.sh is
# the one reader; it refuses a table that is not a synced table, and refuses by
# name every up-only table above, so none of them can be added here by mistake.
#
# Tables with an `id` column that clinics also mint carry a row filter in the
# publication, (id < <floor> OR id % 10 = 0): legacy rows below the hub's floor
# and rows the hub minted itself. The floors are per hub, recorded once, by the
# run that strides the hub's ids (hub/scripts/stride-odoo.sh, which writes
# hub/odoo-down-floors.local). The three link tables have no `id` and carry no
# filter.

odoo:product_template
odoo:product_product
odoo:product_category
odoo:uom_uom
odoo:res_country_state
odoo:state_district
odoo:district_subdistrict
odoo:village_village
odoo:product_taxes_rel
odoo:product_supplier_taxes_rel
odoo:stock_route_product

# Stock transfers from a central warehouse, and what they point to. The hub
# writes a transfer (stock_picking with its stock_move and stock_move_line
# rows); the row filter below sends only the hub's own rows, so a transfer a
# clinic wrote stays at the hub. The receiving clinic completes the transfer
# and its change goes up. Each transfer row is written first by the hub, then by
# the clinic, never by both at once. Stock levels (stock_quant) stay up-only:
# each node keeps the quantities of its own locations, and a transfer passes
# through a location that keeps none.
odoo:stock_location
odoo:stock_warehouse
odoo:stock_picking_type
odoo:stock_route
odoo:stock_rule
odoo:procurement_group
odoo:stock_lot
odoo:stock_warehouse_orderpoint
odoo:stock_picking
odoo:stock_move
odoo:stock_move_line
