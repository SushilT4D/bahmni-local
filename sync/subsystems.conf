# Subsystem topics replicated by MirrorMaker, in BOTH directions.
# Format:  <schema>:<topic>
#
# WHY THIS FILE EXISTS.  Until 2026-09-14 these topics appeared only inside a
# hand-written regex in the rendered mm2.properties.  setup-mirrormaker.sh built
# its pattern from debezium/local/tables.conf alone, which lists OpenMRS tables
# only, so a regenerate silently dropped every Odoo and OpenELIS topic - the
# whole of two subsystems - from replication.  There was no tracked source of
# truth for this list anywhere in the repo.
#
# The same list serves both directions: the clinic publishes <local>.<schema>.*
# and consumes <remote>.<schema>.*, and the sets are identical.  Only the server
# name prefix differs, and that is supplied per node (MYSQL_SERVER_NAME and
# REMOTE_SERVER_NAME).
#
# `all` is the ORDERED AGGREGATE topic (ADR-004, 2026-09-10): Odoo and OpenELIS
# capture into <prefix>.<schema>.all with collection.name.format=${source.table}.
# It is listed FIRST to match the rendered file's existing ordering.
#
# A new synced table in either subsystem must be added HERE as well as to the
# connector's table.include.list and the aggregate's regex.

clinlims:all
odoo:all

clinlims:sample
clinlims:sample_item
clinlims:analysis
clinlims:result

odoo:res_partner
odoo:product_template
odoo:product_product
odoo:product_category
odoo:product_uom
odoo:sale_order
odoo:sale_order_line
# NOTE: no topic exists on either broker for the five below -- checked with
# kafka-topics --list on Rawach 2026-09-14.  They are carried because removing a
# name from a MirrorMaker whitelist is a behaviour change if the topic is ever
# created later, and this commit is deliberately behaviour-preserving.  Decide
# separately whether Odoo stock/accounting is in scope; if not, delete these.
odoo:stock_move
odoo:stock_quant
odoo:stock_picking
odoo:account_invoice
odoo:account_invoice_line
