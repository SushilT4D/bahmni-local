# Subsystem topics replicated by MirrorMaker, in BOTH directions.
# Format:  <schema>:<topic>
#
# WHY THIS FILE EXISTS.  Without it these topics would live only inside a
# hand-written regex in the rendered mm2.properties, and a pattern built from
# the OpenMRS table list alone would silently drop every Odoo and OpenELIS
# topic - the whole of two subsystems - from replication on a regenerate.
# This is the tracked source of truth for the list.
#
# The same list serves both directions: the clinic publishes <local>.<schema>.*
# and consumes <remote>.<schema>.*, and the sets are identical.  Only the server
# name prefix differs, and that is supplied per node (MYSQL_SERVER_NAME and
# REMOTE_SERVER_NAME).
#
# `all` is the ORDERED AGGREGATE topic: Odoo and OpenELIS
# capture into <prefix>.<schema>.all with collection.name.format=${source.table}.
# It is listed FIRST to match the rendered file's existing ordering.
#
# A new synced table in either subsystem must be added HERE as well as to the
# connector's table.include.list and the aggregate's regex.

clinlims:all
odoo:all

clinlims:sample
clinlims:sample_item
clinlims:analysis
clinlims:result
#
# The lab patient and the sample-to-patient link, sent UP only (of the
# OpenELIS tables, only result, analysis and sample come down: sync/hub-down.conf). Each node's OpenELIS creates its own patient rows from its
# own OpenMRS feed, so without these the hub holds a clinic's samples with no
# patient: a result entered at the hub for such a sample cannot be attached to
# anyone. person and provider are the foreign-key targets of patient and
# sample_human; patient_identity carries the patient's identifiers.
clinlims:person
clinlims:patient
clinlims:patient_identity
clinlims:provider
clinlims:sample_human
#
# Who validated a result, sent UP only. result_signature names the result it
# signs (result_id -> result) and the lab account that signed it
# (system_user_id -> system_user), so system_user travels with it and is listed
# first: the clinic writes an account before any signature names it, and the
# hub's ordered up stream keeps that order. Both are strided like every OpenELIS
# table, so a clinic's rows never collide with the hub's or another clinic's.
# The clinic's OpenELIS source publishes only the rows of these two it minted
# (sync/local/tables-conf.sh UP_CLINLIMS_OWN_ROWS): the seed copies the hub's
# accounts and signatures, and a clinic's edit of one of those stays there.
clinlims:system_user
clinlims:result_signature

# renamed onto the Odoo 16 table set (spec s10.4), matching staging
# (bhs-sandbox.bahmni.in) rather than the retired Odoo 10 clinic override.
# Three of the twelve version-specific names changed between Odoo versions
# (the unit-of-measure table and the two invoicing tables); the other nine are
# a straight carry-over. The old "no topic exists yet" caveat no longer
# applies -- this is now the mandated set, not a behaviour-preserving
# placeholder.
#
# res_country_state: both Odoo source connectors' table.include.list and
# aggregate regex capture it, and the hub publication carries it -- a
# res_country_state row a clinic mints locally kills a sink unless the table is
# captured (not excluded). Left out of this file, the publication and striding
# logic derived from this one list would leave it unpublished on a fresh clinic
# and unstrided everywhere. Listed first to match the connectors' own
# table.include.list ordering.
odoo:res_country_state
odoo:res_partner
odoo:product_template
odoo:product_product
odoo:product_category
odoo:uom_uom
odoo:sale_order
odoo:sale_order_line
odoo:stock_move
odoo:stock_quant
odoo:stock_picking
odoo:account_move
odoo:account_move_line

# Address-mapping and customer-attribute tables -- seven more tables, in one
# change so the hub is touched once and clinics are reseeded once. Two groups:
#
# Four id-sequence tables -- sync AND stride. A clinic-minted village_village
# row that collides with the hub's stops a sink. state_district
# and district_subdistrict are village_village's own FK parents and would
# fail the identical way once real addresses use them, not just village.
# res_partner_attributes is the same shape again, one layer over: it grows
# one row per customer attribute, same as village grows one row per
# registration. Parents first (district, subdistrict, village) so the FK
# order reads top to bottom here too, though the publication and the sinks
# route by table name, not by this file's order.
odoo:state_district
odoo:district_subdistrict
odoo:village_village
odoo:res_partner_attributes
#
# Three link tables -- sync ONLY, nothing to stride. Each has a composite
# primary key (prod_id,tax_id for the first two; route_id,product_id for the
# third), no id column and no owning sequence -- collision-free by
# construction once the ids either side of the pair are (a strided product id
# paired with a seed-identical master tax/route id), so striding does not
# apply and must not be attempted (see apply-odoo-sequence-striding.sql's
# composite-key skip). Without these, a product written by a sink arrives on
# a clinic with no default tax and no default route.
odoo:product_taxes_rel
odoo:product_supplier_taxes_rel
odoo:stock_route_product

# Stock transfers from a central warehouse to a clinic, and every table a
# transfer row points to. The hub writes the transfer (a picking with its moves
# and move lines); the clinic receives it and completes it. Sending a picking
# down without its targets would stop the clinic's single, ordered Odoo down
# sink on the first foreign key it cannot satisfy, and every later product and
# price change behind it. The targets, read from the Odoo 16 schema's foreign
# keys of stock_picking, stock_move and stock_move_line: locations, warehouses,
# operation types, routes, rules, procurement groups, lots and reordering
# rules. Products and units are synced above. Partners and users are not sent
# down: a transfer names the warehouses' own partners, which every node has from
# its seed. Stock levels (stock_quant) never go down: each node writes only the
# quantities of its own locations, so a transfer passes through a location that
# keeps no stock.
odoo:stock_location
odoo:stock_warehouse
odoo:stock_picking_type
odoo:stock_route
odoo:stock_rule
odoo:procurement_group
odoo:stock_lot
odoo:stock_warehouse_orderpoint
odoo:stock_move_line
