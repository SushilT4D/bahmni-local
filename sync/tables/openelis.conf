# OpenELIS tables that sync between a clinic and the hub (database clinlims,
# schema clinlims; topics and scripts call it clinlims).
#
#   [up]    tables a clinic captures and sends to the hub
#   [down]  tables the hub sends to clinics
#
# Every script reads this file through sync/tables/tables.sh and
# sync/tables/hub-down.sh. How to change it: sync/tables/README.md.

[up]
# One table per line. A clinic sends every table here up: its OpenELIS source
# connector captures them all into one ordered topic, <clinic>.clinlims.all.
sample
sample_item
analysis
result
#
# The lab patient and the sample-to-patient link, sent UP only (of the
# OpenELIS tables, only result, analysis and sample come down: sync/hub-down.conf). Each node's OpenELIS creates its own patient rows from its
# own OpenMRS feed, so without these the hub holds a clinic's samples with no
# patient: a result entered at the hub for such a sample cannot be attached to
# anyone. person and provider are the foreign-key targets of patient and
# sample_human; patient_identity carries the patient's identifiers.
person
patient
patient_identity
provider
sample_human
#
# Who validated a result, sent UP only. result_signature names the result it
# signs (result_id -> result) and the lab account that signed it
# (system_user_id -> system_user), so system_user travels with it and is listed
# first: the clinic writes an account before any signature names it, and the
# hub's ordered up stream keeps that order. Both are strided like every OpenELIS
# table, so a clinic's rows never collide with the hub's or another clinic's.
# The clinic's OpenELIS source publishes only the rows of these two it minted
# (sync/local/tables-conf.sh UP_CLINLIMS_OWN_ROWS): the seed copies the hub's
# accounts and signatures, and a clinic's edit of one of those stays there.
system_user
result_signature

[down]
# Format:  <table>                  to every clinic
#          <table>:clinic=<column>  to the one clinic whose id <column> holds
#
# Only the lab rows a hub lab user completes (result, analysis, sample), the lab
# accounts (system_user) and the lab test catalogue go down; sync/tables/hub-down.sh
# refuses any other OpenELIS table by name. Samples, patients and signatures are
# written at the clinics.
#
# Rows with an `id` column and no clinic=<column> carry a row filter in the
# hub's publication, (id < <floor> OR id % 10 = 0). The floors are recorded
# just before the hub's OpenELIS ids are strided, by
# cloud/scripts/record-clinlims-down-floors.sh (cloud/clinlims-down-floors.local).
# Lab results entered at the hub for a clinic's sample. A clinic collects a
# sample and sends it, with its analyses, up; an outside lab's result for it is
# entered in the hub's OpenELIS against the clinic's analysis. The hub writes
# the result row and moves the analysis (and, if OpenELIS does, the sample) on
# to its next status; the clinic created those rows, the hub completes them,
# and each row is written by one node at a time.
#
# These rows carry no row filter in the publication: the analysis and sample
# keep the clinic's ids, which the Odoo floor filter would drop. Authorship is
# decided by replication origin instead: the hub's source decodes with
# origin=none, so a row a clinic's up-sink applied at the hub (tagged with that
# clinic's origin) is never published, and only what a hub session wrote goes
# down. Every clinic receives these rows; each keeps only the rows whose
# <column> holds an id it minted: at or above its floor for the table that
# column names, and on its residue (the clinic's OpenELIS down filter). A
# result's own id is the hub's, so it is routed by the analysis it answers.
#
# The lab accounts go to every clinic. A sample the hub moves on carries the
# account of the hub lab user who did it (sample.sys_user_id, a foreign key to
# system_user); without that account at the clinic, the clinic's ordered
# OpenELIS down sink would stop on the first such sample. Like an Odoo master
# row, the publication sends only the hub's own accounts: below its floor
# (cloud/clinlims-down-floors.local, recorded when the hub's OpenELIS ids were
# strided) or ending in 0. Listed first: the hub creates an account before it
# writes anything that names it.
system_user
result:clinic=analysis_id
analysis:clinic=id
sample:clinic=id

# The lab test catalogue: what a lab test, a panel, a sample type, a department
# and a result option are made of in OpenELIS, and every table those rows point
# to by a foreign key. The hub is its only writer: a test is saved at the hub
# (in OpenMRS, whose concept rows come down through cloud/tables.conf), the hub's
# OpenELIS builds its catalogue rows from it, and those rows come down here to
# every clinic, so a clinic's lab knows a test the clinic's doctor can order.
# No clinic sends any of them up (none is in sync/subsystems.conf, and
# sync/hub-down.sh refuses one that is), so every catalogue row at the hub is
# the hub's: below its floor (rows from before its ids were strided) or ending
# in 0. Each table with an `id` carries the floor filter all the same; the two
# without one (organization_organization_type, keyed by its pair of ids, and
# org_mls_lab_type, keyed by org_mlt_id) carry none.
#
# Parents are listed before their children, in foreign-key order. The order of
# this list does not order delivery: every row travels on one ordered stream in
# the order the hub wrote it, and the hub's own foreign keys make it write a
# parent before a child.
scriptlet
label
method
test_formats
test_trailer
type_of_test_result
org_mls_lab_type
organization
organization_type
organization_organization_type
dictionary_category
dictionary
unit_of_measure
test_section
type_of_sample
analyte
test
test_result
test_analyte
result_limits
panel
panel_item
sampletype_test
sampletype_panel
