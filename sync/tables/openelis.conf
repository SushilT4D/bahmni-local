# OpenELIS (Postgres database openelis, schema clinlims) tables that sync
# between clinics and the hub. [up]: a clinic sends to the hub. [down]: changes
# captured on the cloud server, which each clinic's MirrorMaker pulls.

[up]
# one table per line
sample
sample_item
analysis
result
person
person_address
patient
patient_identity
provider
sample_human
system_user
result_signature

[down]
# table[:clinic=<column>]
#   (none)          kept by every clinic
#   clinic=<column> kept only by the clinic whose id <column> holds
system_user
result:clinic=analysis_id
analysis:clinic=id
sample:clinic=id
scriptlet
label
method
test_formats
test_trailer
type_of_test_result
org_mls_lab_type
organization
organization_type
organization_organization_type
dictionary_category
dictionary
unit_of_measure
test_section
type_of_sample
analyte
test
test_result
test_analyte
result_limits
panel
panel_item
sampletype_test
sampletype_panel
