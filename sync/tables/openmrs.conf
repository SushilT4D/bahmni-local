# OpenMRS (MySQL database openmrs) tables that sync between clinics and the hub.
# [up]: a clinic sends to the hub. [down]: changes captured on the cloud server, which each clinic's MirrorMaker pulls.

[up]
# table:primary_key[:floor]
#   floor   <number>       ids from this number up are the clinic's own
#           seed           the floor is FLOOR_<TABLE> in the seed's manifest.env
#           floor=<table>  uses <table>'s floor (same key)
#           (none)         synced with no floor
encounter:encounter_id:528000
encounter_provider:encounter_provider_id:528000
encounter_type:encounter_type_id:500000
patient:patient_id:230000
patient_identifier:patient_identifier_id:230000
person:person_id:230000
person_address:person_address_id:230000
person_attribute:person_attribute_id:750000
person_name:person_name_id:230000
visit:visit_id:625000
visit_attribute:visit_attribute_id:625000
idgen_seq_id_gen:id
obs:obs_id:seed
orders:order_id:seed
drug_order:order_id:floor=orders
test_order:order_id:floor=orders

[down]
# table:primary_key[,key2...][:role]
#   role    (none)          the hub writes it; every row is sent
#           changes         the hub writes it; only changes from now on are sent
#           hub-rows        both write it; only the hub's rows are captured
#                           (at or above the [up] floor, ending in 0)
#           clinic=<column> the hub's rows for one clinic, chosen by <column>
#           relay           a clinic writes it; the hub passes it on (opt-in)
users:user_id
user_property:user_id,property
user_role:user_id,role
role:role
role_privilege:role,privilege
role_role:parent_role,child_role
provider:provider_id
form:form_id
form_resource:form_resource_id
person:person_id:hub-rows
person_name:person_name_id:hub-rows
encounter:encounter_id:clinic=visit_id
obs:obs_id:clinic=order_id
concept_class:concept_class_id:changes
concept_reference_source:concept_source_id:changes
concept:concept_id:changes
concept_name:concept_name_id:changes
concept_description:concept_description_id:changes
concept_numeric:concept_id:changes
concept_answer:concept_answer_id:changes
concept_set:concept_set_id:changes
concept_reference_term:concept_reference_term_id:changes
concept_reference_map:concept_map_id:changes
