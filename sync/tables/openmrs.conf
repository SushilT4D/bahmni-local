# OpenMRS tables that sync between a clinic and the hub.
#
#   [up]    tables a clinic captures and sends to the hub
#   [down]  tables the hub sends to clinics
#
# Each section has its own line format, described at its top. Every script
# reads this file through sync/tables/tables.sh. How to change it:
# sync/tables/README.md.

[up]
# Format:
#   table_name:primary_key_column:base_id   — sync + clinic AUTO_INCREMENT spacing
#   table_name:primary_key_column:seed      — the same, with the floor taken from
#                                             the seed: FLOOR_<TABLE_NAME> in the
#                                             seed's manifest.env (a multiple of 10)
#   table_name:primary_key_column:floor=t   — sync only; the key is table t's key, so
#                                             the floor is t's (no counter of its own)
#   table_name:primary_key_column           — sync only
#
# A sync-only table whose key column is the key of a table with a floor must
# name that table's floor (floor=t): without it, nothing tells its legacy rows
# from this clinic's own. Every script that reads this file reads it through
# sync/local/tables-conf.sh, which refuses a line it cannot place.
#
# A table whose floor comes from the seed, or from another table (seed,
# floor=t), is published only for rows this clinic wrote: key at or above the
# floor and on this clinic's residue. Edits to the hub's rows, or to another
# clinic's, stay at this clinic. The source connector carries that test as a
# filter step per table (sync/origin-filter.sh).
#

# Core OpenMRS tables (PK-spaced)
encounter:encounter_id:528000
encounter_provider:encounter_provider_id:528000
encounter_type:encounter_type_id:500000
patient:patient_id:230000
patient_identifier:patient_identifier_id:230000
person:person_id:230000
person_address:person_address_id:230000
person_attribute:person_attribute_id:750000
person_name:person_name_id:230000
visit:visit_id:625000
visit_attribute:visit_attribute_id:625000

# Idgen sequence counter (patient IDs like RAW125450) — sync only
idgen_seq_id_gen:id

# Clinical data (clinic -> hub). The floors come from the seed: FLOOR_OBS and
# FLOOR_ORDERS in its manifest.env, measured on the hub when it was cut. A
# clinic publishes a change only for a row at or above the floor on its own
# residue (the capture filter); its rows written before these lines took
# effect are sent with clinic/scripts/catch-up-clinical.sh. drug_order and
# test_order are the two order subclasses: each one's key is orders.order_id, so
# each reads the orders floor and has no counter. A lab order is an orders row
# with its test_order row; without test_order the hub holds the order with no
# lab detail.
obs:obs_id:seed
orders:order_id:seed
drug_order:order_id:floor=orders
test_order:order_id:floor=orders

[down]
# Format: table_name:primary_key_column[,pk2…][:role]   (roles at the end of this section)
#
# Each row is also a table the clinic's sink database user is granted: seed task
# 050 grants every row; on a node already seeded, run
# clinic/scripts/grant-down-tables.sh before registering a new table's sink.

# A clinic that keeps its own OpenMRS database takes these, with person and
# person_name, only as rows the hub wrote: its own down list marks them
# `hub-written` (clinic/scripts/generate-sink-connectors.sh), a role this
# file never uses.
users:user_id
user_property:user_id,property
user_role:user_id,role
role:role
role_privilege:role,privilege
role_role:parent_role,child_role
provider:provider_id

# Observation forms. The hub is the only node that publishes forms (in the form
# builder), so every clinic carries the hub's own form rows: the same id, uuid
# and version everywhere, which matters because a saved observation names its
# form by name and version. form_resource holds each form's pointer to its file
# (/home/bahmni/clinical_forms/<uuid>.json) and its name translations; the files
# themselves reach a clinic through the forms repo (clinic/install/forms.sh).
# form_resource.form_id refers to form, but neither table carries a foreign key
# constraint, so a form_resource row that arrives before its form is written
# anyway: listing form first orders the sinks' registration, not their writes.
form:form_id
form_resource:form_resource_id

# The people behind the hub's logins and providers. Both the hub and the clinics
# write person and person_name, each on its own rows: a staff member is created
# at the hub, a patient at a clinic. Without these two tables a user or provider
# made at the hub arrives with no person: the UI cannot show it and the login is
# refused with no message.
#
# ROLE `hub-rows`: the hub's source publishes only the rows the hub wrote: the
# key is at or above the table's floor (its base in sync/local/tables.conf) and
# ends in 0, the hub's residue. Rows below the floor predate striding and sit on
# every residue; rows a clinic sent up end in that clinic's residue. Neither is
# published, so nothing a clinic wrote comes back down, and a hub edit to an
# older row stays at the hub. Every clinic keeps every row that arrives.
person:person_id:hub-rows
person_name:person_name_id:hub-rows

# Lab results entered at the hub for a clinic's patient. A result for a sample
# a clinic sent out is entered in the hub's OpenELIS; the hub's OpenMRS turns it
# into an encounter with its observations, once, on the hub's own ids. Those rows
# go to the clinic the patient belongs to, so the result is on the clinic's
# patient record. The clinic never builds the result itself: rows that arrive
# by sync fire no OpenELIS feed, so nothing is processed twice.
#
# ROLE `clinic=<column>`: the hub's source publishes only the rows the hub
# wrote: the key ends in 0 (the hub's residue), so a row a clinic sent up is
# never sent anywhere again. Each clinic's down sink keeps only the rows whose
# <column> names a row that clinic wrote: it ends in the clinic's own residue
# and is at or above that table's base (sync/local/tables.conf; for orders, the
# floor the seed carries). A result is routed by the visit and the order it
# answers, not by the patient: a patient registered before the bases exist
# (any patient id) still gets the result of an order a clinic placed, and a
# result for an order the hub itself placed stays at the hub.
#   encounter by visit_id  - the visit the clinic opened for the patient
#   obs       by order_id  - the clinic's order the result answers; an obs
#                            with no order stays at the hub
# encounter_provider has neither column and is not sent.
encounter:encounter_id:clinic=visit_id
obs:obs_id:clinic=order_id

# The concept dictionary: what a doctor orders a lab test from (the test, its
# panel, its department and sample type, its coded answers and units), and the
# rest of the dictionary those rows point to. The hub is the only writer of
# these tables; a test is created or changed at the hub, and the change comes
# down to every clinic, with the matching rows of the hub's OpenELIS lab
# catalogue (sync/hub-down.conf), so the clinic's lab knows the test the doctor
# orders.
#
# ROLE `changes`: the hub authors the table, and its source sends only changes
# made from now on, never the rows the table already holds. A clinic already
# holds them: from the hub's copy it was seeded from, or, for a clinic that
# keeps its own database, from that database. The source's first snapshot
# reads the table's structure and none of its rows (a dictionary of hundreds of
# thousands of rows is not resent to every clinic). No row filter: the hub
# writes every row of these tables, including its edits of rows older than its
# own residue, and each such edit must come down.
#
# A clinic's sinks for these tables apply inserts and updates and never a
# delete: the hub retires a concept rather than deleting it, and a delete would
# fail on the clinic's own rows that point to it. Before these sinks are
# enabled on a clinic, clinic/scripts/clinic-minted-concepts.sh must find no
# concept row the clinic minted for itself (one whose uuid the hub holds under
# another id, or one on a residue other than the hub's above the hub's last
# legacy id).
concept_class:concept_class_id:changes
concept_reference_source:concept_source_id:changes
concept:concept_id:changes
concept_name:concept_name_id:changes
concept_description:concept_description_id:changes
concept_numeric:concept_id:changes
concept_answer:concept_answer_id:changes
concept_set:concept_set_id:changes
concept_reference_term:concept_reference_term_id:changes
concept_reference_map:concept_map_id:changes

# ROLE FIELD (third, optional). Omitted = the CLOUD AUTHORS this table. `changes`
# = the cloud authors it and sends changes only (above). `relay` =
# the CLINIC authors it and the hub merely relays it downward, which
# is what makes a patient registered at one clinic visible at another.
#
# Both kinds arrive at a clinic and both need a down-direction sink, so the
# clinic's generators read every line here. The hub's own source connector reads
# only the unmarked ones, because the relay rule is recorded as DESIGNED BUT
# UNTESTED and generating a config from it would put this file ahead of the
# decision. `generate-table-config.sh cloud --include-relay` opts in.
#
# WHY THE FIELD EXISTS. person/person_name are here to fix
# a cloud-created user arriving at a clinic as an orphan because person
# never synced down. That was right for the clinic and wrong for the hub: the
# cloud source generator's guard refuses any clinic-owned table, so the same file
# could not satisfy both readers and the two branches drifted to different
# answers. The role says which reader a line is for, instead of the file having
# to pick one.
