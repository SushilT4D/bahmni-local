# Odoo (Postgres database odoo, schema public) tables that sync between clinics
# and the hub. [up]: a clinic sends to the hub. [down]: changes captured on the
# cloud server, which every clinic's MirrorMaker pulls; each must also be in [up].

[up]
# one table per line
res_country_state
res_partner
product_template
product_product
product_category
uom_uom
sale_order
sale_order_line
stock_move
stock_quant
stock_picking
account_move
account_move_line
state_district
district_subdistrict
village_village
res_partner_attributes
product_taxes_rel
product_supplier_taxes_rel
stock_route_product
stock_location
stock_warehouse
stock_picking_type
stock_route
stock_rule
procurement_group
stock_lot
stock_warehouse_orderpoint
stock_move_line

[down]
# one table per line
product_template
product_product
product_category
uom_uom
res_country_state
state_district
district_subdistrict
village_village
product_taxes_rel
product_supplier_taxes_rel
stock_route_product
