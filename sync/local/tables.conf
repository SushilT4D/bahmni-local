# Local → cloud CDC (Debezium source on the clinic).
# Format:
#   table_name:primary_key_column:base_id   — sync + clinic AUTO_INCREMENT spacing
#   table_name:primary_key_column:seed      — the same, with the floor taken from
#                                             the seed: FLOOR_<TABLE_NAME> in the
#                                             seed's manifest.env (a multiple of 10)
#   table_name:primary_key_column:floor=t   — sync only; the key is table t's key, so
#                                             the floor is t's (no counter of its own)
#   table_name:primary_key_column           — sync only
#
# A sync-only table whose key column is the key of a table with a floor must
# name that table's floor (floor=t): without it, nothing tells its legacy rows
# from this clinic's own. Every script that reads this file reads it through
# sync/local/tables-conf.sh, which refuses a line it cannot place.
#
# A table whose floor comes from the seed, or from another table (seed,
# floor=t), is published only for rows this clinic wrote: key at or above the
# floor and on this clinic's residue. Edits to the hub's rows, or to another
# clinic's, stay at this clinic. The source connector carries that test as a
# filter step per table (sync/origin-filter.sh).
#
# After edits:
#   ./scripts/generate-connectors.sh
#   ./scripts/register-source-connector.sh

# Core OpenMRS tables (PK-spaced)
encounter:encounter_id:528000
encounter_provider:encounter_provider_id:528000
encounter_type:encounter_type_id:500000
patient:patient_id:230000
patient_identifier:patient_identifier_id:230000
person:person_id:230000
person_address:person_address_id:230000
person_attribute:person_attribute_id:750000
person_name:person_name_id:230000
visit:visit_id:625000
visit_attribute:visit_attribute_id:625000

# Idgen sequence counter (patient IDs like RAW125450) — sync only
idgen_seq_id_gen:id

# Clinical data (clinic -> hub), sent only by a clinic installed with
# CLINICAL_UP_SYNC=test; every other clinic leaves these three lines out
# (sync/local/tables-conf.sh up_tables_for_clinic). The floors come from the seed: FLOOR_OBS and
# FLOOR_ORDERS in its manifest.env, measured on the hub when it was cut. A
# clinic publishes a change only for a row at or above the floor on its own
# residue (the capture filter); its rows written before these lines took
# effect are sent with clinic/scripts/catch-up-clinical.sh. drug_order's key
# is orders.order_id, so it reads the orders floor and has no counter.
obs:obs_id:seed
orders:order_id:seed
drug_order:order_id:floor=orders
