# The fleet's written verdict on every table that touches the synced set
# without being IN it: a table outside sync/subsystems.conf's odoo:/clinlims:
# rows that is linked by a foreign key (either direction) to a table that IS
# synced, and has gained rows since install. A table that shows up in
# clinic/scripts/preflight.sh's unsynced-tables WARN and is NOT listed here is
# a new village_village until someone gives it a verdict.
#
# Format:  <db>:<table>  # <kind>: <reason>
#   db    odoo | openelis (the Postgres database, not sync/subsystems.conf's
#         schema-based clinlims: prefix -- OpenELIS's schema is clinlims, its
#         database is openelis)
#   kind  static     -- reference data that never changes; the seed is enough
#         master     -- config/master data, changed by an admin in one place
#                       and redistributed (config image, reseed); a row
#                       created on a clinic never reaches another
#         node-local -- correct NOT to sync (plumbing, chatter); syncing it
#                       would double-fire
#         pending    -- an open design question, not yet a verdict
#
# Seeded from an inventory of every table outside the synced set that touches
# a synced one.

