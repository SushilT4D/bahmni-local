# The foreign keys that point INTO obs, orders and drug_order on the hub, one
# per line: <table> <column> <referenced table> <referenced column>.
# hub/scripts/check-clinical-fks.sh reports any difference from this list.
#
# None of them stops an up sink when a clinic's row arrives before its parent:
# they point at the clinical rows, not out of them. They do make a delete of a
# clinical row that one of these hub rows references fail that table's sink,
# on purpose (the sinks do not tolerate errors), so the stall is seen rather
# than the row silently kept or lost. A new one widens that set; change this
# list only after reading which module added it and what it references.
document_reference order_id orders order_id
fhir_diagnostic_report_results obs_id obs obs_id
fhir_diagnostic_report_service_request order_id orders order_id
imaging_study order_id orders order_id
imaging_study_quality_assessment obs_id obs obs_id
immunization_based_on order_id orders order_id
ipd_slot order_id orders order_id
medication_administration drug_order_id drug_order order_id
medication_dispense drug_order_id drug_order order_id
order_attribute order_id orders order_id
referral_order order_id orders order_id
