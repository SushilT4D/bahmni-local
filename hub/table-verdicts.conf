# --- metadata mapping: proposed DOWN, not yet ratified -------------------------------------
metadatamapping_metadata_term_mapping   pending DOWN
metadatamapping_metadata_source         pending DOWN
metadatamapping_metadata_set            pending DOWN
metadatamapping_metadata_set_member     pending DOWN

# --- written by changesets, or a change is a fleet reseed --------------------------------------
concept_datatype                        RESEED
concept_map_type                        RESEED
care_setting                            RESEED
concept_stop_word                       RESEED
address_hierarchy_entry                 RESEED
address_hierarchy_level                 RESEED
address_hierarchy_address_to_entry_map  RESEED
fhir_observation_category_map           RESEED
# carries a physical foreign key to concept_reference_source, so a child that
# arrived before its parent would stop the sink: proposed RESEED, not yet ratified
fhir_concept_source                     pending RESEED

# --- written at the clinic and sent up ------------------------------------------------------------
encounter                               UP
encounter_provider                      UP
# encounter_type is written at clinics and captured up; the hub does not filter
# its own capture by origin, so sending it down as well would loop. A new
# encounter type reaches clinics by reseed.
encounter_type                          UP
patient                                 UP
patient_identifier                      UP
person_address                          UP
person_attribute                        UP
visit                                   UP
visit_attribute                         UP
# the patient-identifier counter; each clinic has its own range
idgen_seq_id_gen                        UP
obs                                     UP
orders                                  UP
drug_order                              UP

# --- written at a clinic, relayed by the hub to the others -----------------------------------------
person                                  relay
person_name                             relay

# --- not synced ------------------------------------------------------------------------------------
global_property                         OUT
idgen_auto_generation_option            OUT
appointment_speciality                  OUT
appointment_service                     OUT
appointment_service_type                OUT
bed                                     OUT
bed_type                                OUT
bed_location_map                        OUT
# empty, and the map has no primary key to sync on
concept_name_tag                        OUT
concept_name_tag_map                    OUT
# its rows start scheduled tasks: the hub's set would start the hub's feed
# publishers at a clinic. Proposed OUT, not yet ratified.
scheduler_task_config                   pending OUT
