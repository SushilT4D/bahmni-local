concept_answer                          DOWN
concept_set                             DOWN
concept_numeric                         DOWN
concept_complex                         DOWN
concept_reference_term                  DOWN
concept_reference_term_map              DOWN
concept_reference_map                   DOWN
concept_attribute_type                  DOWN
concept_attribute                       DOWN

# --- drugs ----------------------------------------------------------------------------
drug                                    DOWN
drug_ingredient                         DOWN
drug_reference_map                      DOWN

# --- locations --------------------------------------------------------------------------
location                                DOWN
location_tag                            DOWN
location_tag_map                        DOWN
location_attribute                      DOWN
location_attribute_type                 DOWN
location_encounter_type_map             DOWN

# --- programs ---------------------------------------------------------------------------
program                                 DOWN
program_workflow                        DOWN
program_workflow_state                  DOWN
program_attribute_type                  DOWN

# --- types that clinic rows refer to ------------------------------------------------------
