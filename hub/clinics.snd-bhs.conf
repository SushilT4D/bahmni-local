# Clinics the hub snd-bhs accepts up-direction data from. Each hub has its own
# file, hub/clinics.<HUB_NAME>.conf (HUB_NAME in that hub's hub/.env), so one
# hub's clinics never reach another hub's sinks; the join adds a clinic's row to
# the file of the hub it joins.
#
# Format:  clinic:connector_name_prefix:mm_prefix:server_name[:clinical]
#
#   clinic                 slug, for messages and output filtering only
#   connector_name_prefix  what every sink for this clinic is named with, before
#                          the table name. MUST be unique per clinic: registering
#                          two clinics under one name silently REPLACES the first
#                          clinic's live connector, which is how this generator
#                          could only ever serve one clinic.
#   mm_prefix              this clinic's MirrorMaker cluster alias -- the first
#                          segment of every topic it publishes to the hub. It is
#                          LOCAL_CLUSTER_ALIAS in the clinic's own .env.
#   server_name            this clinic's Debezium logical server name, i.e.
#                          MYSQL_SERVER_NAME in the clinic's .env.
#   clinical               present only for a clinic installed with
#                          CLINICAL_UP_SYNC=test, which sends obs, orders,
#                          drug_order and test_order (test data only). Without it the hub
#                          renders no sink for those tables for the clinic.
#
# Topic consumed:  <mm_prefix>.<server_name>.<database>.<table>
#
# Every clinic takes an infixed prefix (mysql-sink-<clinic>-).

ghated:mysql-sink-ghated-:ghated:bahmni-ghated:clinical
manpur:mysql-sink-manpur-:manpur:bahmni-manpur:clinical
