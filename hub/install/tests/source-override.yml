# Compose override for test_sources.sh ONLY -- layered on TOP of
# boot-override.yml (kafka/kafka-controller renamed to hubtest-kafka/
# hubtest-kafka-controller, kafka's host ports reset). This file adds the
# third and last container test_sources.sh needs: a throwaway Kafka Connect,
# renamed the same way and for the same reason (hub/docker-compose.yml pins
# container_name: kafka-connect, and this Mac already runs a real one).
#
# `ports: !override [...]` replaces the base file's 127.0.0.1:8083:8083
# outright (compose's default list merge APPENDS, which would keep BOTH, and
# the base 8083 mapping collides with the real stack's own kafka-connect) --
# published on 18083 instead, never 8083. `!reset` (as boot-override.yml uses
# for kafka's ports) only ever clears a key to empty regardless of what
# follows the tag -- confirmed directly (`!reset ['x']` still produced no
# ports key at all) -- so a real replacement value needs `!override`, not
# `!reset`.
#
# `depends_on: !override` replaces the base file's map wholesale, dropping
# the schema-registry dependency entirely rather than merely leaving it
# unmentioned (compose's default map merge is key-by-key, which would keep
# schema-registry's entry untouched, and a container literally named
# schema-registry collides with the real stack the same way kafka-connect
# does). Nothing test_sources.sh proves needs schema-registry: every
# converter in play, on kafka-connect itself and on all three registered
# connectors, is JsonConverter -- schema-registry exists in
# hub/docker-compose.yml only because a later Avro/Confluent-format connector
# might want it, not because anything here does.
#
# Service name inside the compose network stays "kafka-connect" (container_name
# is a docker-level identifier only), so BOOTSTRAP_SERVERS: kafka:29092 and
# every ${REMOTE_SERVER_NAME}-prefixed connector config needs no change here.
#
# KAFKA_HEAP_OPTS (Ruling 15): same trim and same reasoning as boot-
# override.yml's kafka/kafka-controller -- a map key, merges additively into
# the base file's `environment` map. Three connectors and a handful of test
# rows are nowhere near what the Debezium Connect image's own default heap
# assumes.
#
# kafka (Ruling 9): boot-override.yml already reset this service's ports to
# `[]` (this Mac may already run a real hub bound to the base file's own
# 127.0.0.1:9092/9093). Task 090's exit checks re-prove the SASL listener at
# the end of the install (sasl_listener_ok, hub/install/lib.sh), so this
# layer republishes just the SASL port -- on 19092, never the real 9092 --
# and test_sources.sh exports SASL_LISTENER_PORT=19092 to match before
# running 090. 9093 (the base file's other kafka mapping) is not needed by
# anything here and stays unpublished.
#
# schema-registry (final review, Important 3b): task 060 brings it up for real
# now that the live smoke runs the INSTALLER rather than a hand-picked pair of
# tasks, so it needs the same treatment as every other service here -- renamed
# (this Mac already runs a real container called schema-registry) and
# republished on 18082 instead of the base file's own 127.0.0.1:8082, which
# that real one already holds. 060 dials it through
# HUB_SCHEMA_REGISTRY_URL_OVERRIDE. The heap trim is the same reasoning as
# kafka's above: nothing here stores a single Avro schema.
#
# kafka-ui (Ruling 9): the only real proof of Ruling 3 -- a throwaway
# instance, renamed and republished on 18080 rather than the real 8080, so
# task 070's own two checks (login page 200, /api/clusters refused
# unauthenticated) can be exercised for real. Its `environment` (cluster
# name, bootstrap servers, Connect address) all reference SERVICE names
# (kafka, kafka-connect), which resolve to these renamed containers exactly
# the same either way -- container_name is a docker-level identifier only,
# never part of Compose's internal DNS.
services:
  kafka:
    ports: !override
      - '127.0.0.1:19092:9092'
  schema-registry:
    container_name: hubtest-schema-registry
    ports: !override
      - '127.0.0.1:18082:8081'
    environment:
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms256m -Xmx512m"
  kafka-connect:
    container_name: hubtest-kafka-connect
    depends_on: !override
      kafka:
        condition: service_healthy
    ports: !override
      - '127.0.0.1:18083:8083'
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx1g"
  kafka-ui:
    container_name: hubtest-kafka-ui
    ports: !override
      - '127.0.0.1:18080:8080'
