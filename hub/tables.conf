# Cloud → local sync (topics under bahmni-cloud / cloud.*).
# Format: table_name:primary_key_column[,pk2…]
# After edits: ./scripts/generate-sink-connectors.sh && register sinks on the clinic
# (or regenerate local sink connectors that consume cloud topics).
# Each row is also a table the clinic's sink database user is granted: seed task
# 050 grants every row; on a node already seeded, run
# clinic/scripts/grant-down-tables.sh before registering a new table's sink.

users:user_id
user_property:user_id,property
user_role:user_id,role
role:role
role_privilege:role,privilege
role_role:parent_role,child_role
provider:provider_id

# Observation forms. The hub is the only node that publishes forms (in the form
# builder), so every clinic carries the hub's own form rows: the same id, uuid
# and version everywhere, which matters because a saved observation names its
# form by name and version. form_resource holds each form's pointer to its file
# (/home/bahmni/clinical_forms/<uuid>.json) and its name translations; the files
# themselves reach a clinic through the forms repo (clinic/install/forms.sh).
# form_resource.form_id refers to form, but neither table carries a foreign key
# constraint, so a form_resource row that arrives before its form is written
# anyway: listing form first orders the sinks' registration, not their writes.
form:form_id
form_resource:form_resource_id

# person and person_name were added to the running fleet but never to this file, so
# regenerating produced 7 sinks and silently dropped both. The failure that
# causes: a cloud-created staff member arrives with roles present and
# REST reporting authenticated=true, but ZERO person_name rows -- the UI cannot render
# them and login is refused with no message, while the database reads clean. Verified
# against the live schema (person.person_id, person_name.person_name_id)
# and against the 9 mysql-local-sink-* connectors actually registered on both clinics.
person:person_id:relay
person_name:person_name_id:relay

# Lab results entered at the hub for a clinic's patient. A result for a sample
# a clinic sent out is entered in the hub's OpenELIS; the hub's OpenMRS turns it
# into an encounter with its observations, once, on the hub's own ids. Those rows
# go to the clinic the patient belongs to, so the result is on the clinic's
# patient record. The clinic never builds the result itself: rows that arrive
# by sync fire no OpenELIS feed, so nothing is processed twice.
#
# ROLE `clinic=<column>`: the hub's source publishes only the rows the hub
# wrote: the key ends in 0 (the hub's residue), so a row a clinic sent up is
# never sent anywhere again. Each clinic's down sink keeps only the rows whose
# <column> names a row that clinic wrote: it ends in the clinic's own residue
# and is at or above that table's base (sync/local/tables.conf; for orders, the
# floor the seed carries). A result is routed by the visit and the order it
# answers, not by the patient: a patient registered before the bases exist
# (any patient id) still gets the result of an order a clinic placed, and a
# result for an order the hub itself placed stays at the hub.
#   encounter by visit_id  - the visit the clinic opened for the patient
#   obs       by order_id  - the clinic's order the result answers; an obs
#                            with no order stays at the hub
# encounter_provider has neither column and is not sent.
encounter:encounter_id:clinic=visit_id
obs:obs_id:clinic=order_id

# ROLE FIELD (third, optional). Omitted = the CLOUD AUTHORS this table. `relay` =
# the CLINIC authors it and the hub merely relays it downward, which
# is what makes a patient registered at one clinic visible at another.
#
# Both kinds arrive at a clinic and both need a down-direction sink, so the
# clinic's generators read every line here. The hub's own source connector reads
# only the unmarked ones, because the relay rule is recorded as DESIGNED BUT
# UNTESTED and generating a config from it would put this file ahead of the
# decision. `generate-table-config.sh cloud --include-relay` opts in.
#
# WHY THE FIELD EXISTS. person/person_name are here to fix
# a cloud-created user arriving at a clinic as an orphan because person
# never synced down. That was right for the clinic and wrong for the hub: the
# cloud source generator's guard refuses any clinic-owned table, so the same file
# could not satisfy both readers and the two branches drifted to different
# answers. The role says which reader a line is for, instead of the file having
# to pick one.
