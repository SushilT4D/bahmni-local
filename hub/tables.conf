# Cloud → local sync (topics under bahmni-cloud / cloud.*).
# Format: table_name:primary_key_column[,pk2…]
# After edits: ./scripts/generate-sink-connectors.sh && register sinks on the clinic
# (or regenerate local sink connectors that consume cloud topics).

users:user_id
user_property:user_id,property
user_role:user_id,role
role:role
role_privilege:role,privilege
role_role:parent_role,child_role
provider:provider_id

# person and person_name were added to the running fleet but never to this file, so
# regenerating produced 7 sinks and silently dropped both. That is the BL-042 failure
# sync-core/F-012 closed: a cloud-created staff member arrives with roles present and
# REST reporting authenticated=true, but ZERO person_name rows -- the UI cannot render
# them and login is refused with no message, while the database reads clean. Verified
# 2026-09-14 against the live schema (person.person_id, person_name.person_name_id)
# and against the 9 mysql-local-sink-* connectors actually registered on both clinics.
person:person_id:relay
person_name:person_name_id:relay

# ROLE FIELD (third, optional). Omitted = the CLOUD AUTHORS this table. `relay` =
# the CLINIC authors it and the hub merely relays it downward (ADR-003 s7), which
# is what makes a patient registered at one clinic visible at another.
#
# Both kinds arrive at a clinic and both need a down-direction sink, so the
# clinic's generators read every line here. The hub's own source connector reads
# only the unmarked ones, because the relay rule is recorded as DESIGNED BUT
# UNTESTED and generating a config from it would put this file ahead of the
# decision. `generate-table-config.sh cloud --include-relay` opts in.
#
# WHY THE FIELD EXISTS. person/person_name were added here on 2026-09-14 to fix
# a cloud-created user arriving at a clinic as an orphan because person
# never synced down. That was right for the clinic and wrong for the hub: the
# cloud source generator's guard refuses any clinic-owned table, so the same file
# could not satisfy both readers and the two branches drifted to different
# answers. The role says which reader a line is for, instead of the file having
# to pick one.
