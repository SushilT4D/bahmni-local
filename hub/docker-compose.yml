x-rotate-logs: &rotate
  # For the services that do NOT reference *log-config in the base file and so
  # inherit no logging config at all. Fixing x-default-logging alone covered
  # only 13 of 29 here -- and left kafka-connect, holding a 799 MB unrotated
  # json.log, among the uncovered. A YAML anchor is file-scoped, so it is
  # redeclared rather than reused from the base file.
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:

  # --- KRaft migration (KIP-866): dedicated controller quorum ---
  kafka-controller:
    image: ${KAFKA_IMAGE:?}
    hostname: kafka-controller
    container_name: kafka-controller
    logging: *rotate
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?}
      KAFKA_NODE_ID: 3000
      KAFKA_PROCESS_ROLES: 'controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '3000@kafka-controller:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENERS: 'CONTROLLER://0.0.0.0:9093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - kafka-controller-data:/var/lib/kafka/data
    # 8.3.2 (AK 4.3) image defect: it bakes ENV KAFKA_ADVERTISED_LISTENERS="", and a
    # controller-only node accepts neither an empty nor a non-empty value through
    # the env -- so it is unset before the entrypoint runs (sync/tests/kafka-8-notes.md;
    # same fix as clinic/docker-compose.yml's kafka-controller, 966c875).
    command: ["/bin/bash", "-c", "unset KAFKA_ADVERTISED_LISTENERS; exec /etc/confluent/docker/run"]

  kafka:
    image: ${KAFKA_IMAGE:?}
    hostname: kafka
    container_name: kafka
    logging: *rotate
    depends_on:
      kafka-controller:
        condition: service_started
    ports:
      - '127.0.0.1:9092:9092'
      - '127.0.0.1:9093:9093'
    environment:
      # --- KRaft (KIP-866) stage 2: pure KRaft; ZooKeeper no longer consulted ---
      # CLUSTER_ID is mandatory for the Confluent image in KRaft mode and must
      # match the id in the kafka-data volume's meta.properties.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '3000@kafka-controller:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,SASL_PLAINTEXT://${REMOTE_KAFKA_HOST:-localhost}:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,SASL_PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      # SASL configuration
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      # JAAS configuration (username/password)
      KAFKA_OPTS: >-
        -Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf
        -Dzookeeper.sasl.client=false
      # MM-07: cp-kafka's preflight (cub zk-ready) sees the JAAS file in
      # KAFKA_OPTS and then demands a SASL zookeeper — but his zookeeper is
      # plain, so the probe times out even though the session establishes.
      # This env tells the probe zookeeper SASL is off. Broker config unchanged.
      ZOOKEEPER_SASL_ENABLED: "FALSE"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf:ro
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]

      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  schema-registry:
    image: ${SCHEMA_REGISTRY_IMAGE:?}
    hostname: schema-registry
    container_name: schema-registry
    logging: *rotate
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '127.0.0.1:8082:8081'   # host 8081 is the cloud proxy's HTTP remap
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
        #SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: 'SASL_PLAINTEXT'
        #SCHEMA_REGISTRY_KAFKASTORE_SASL_MECHANISM: 'PLAIN'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      # 8.3.2's cp-schema-registry image ships neither curl nor wget
      # (sync/tests/kafka-8-notes.md). A bare /dev/tcp connect only proves the
      # port is bound, not that the registry is serving -- and this healthcheck
      # gates kafka-connect's depends_on -- so it sends a real HTTP/1.0 GET for
      # /subjects and greps the status line for " 200 ".
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /subjects HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-connect:
    image: ${DEBEZIUM_CONNECT_IMAGE:?}
    hostname: kafka-connect
    container_name: kafka-connect
    logging: *rotate
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - '127.0.0.1:8083:8083'
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
        #CONNECT_SASL_MECHANISM: PLAIN
        #CONNECT_SECURITY_PROTOCOL: SASL_PLAINTEXT
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_TOPIC: docker-connect-offsets
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_TOPIC: docker-connect-status
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_PLUGIN_PATH: /kafka/connect,/usr/share/confluent-hub-components
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_PORT: 8083
    volumes:
      - ./connectors:/kafka/connect/connectors:ro
      - connect-data:/kafka/connect/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Topic/consumer/Connect browser, behind a real login -- task 070 brings it
  # up alongside kafka-connect and proves both the login page answers AND an
  # unauthenticated API call is refused. 127.0.0.1 only: this is an operator
  # convenience on the hub host itself, never a service another node dials.
  kafka-ui:
    image: ${KAFKA_UI_IMAGE:?}
    hostname: kafka-ui
    container_name: kafka-ui
    logging: *rotate
    depends_on:
      kafka-connect:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:?}
      # Compose's ${VAR} substitution inserts hub/.env's raw value verbatim,
      # byte for byte, into this environment entry -- unlike
      # kafka_server_jaas.conf (a properties FILE this installer generates
      # and must itself quote correctly), there is no second text format here
      # for a "'" or "\" in the password to break out of, so no
      # jaas_escape-style pass applies. gen_secret() (hub_compose_env's
      # default for this key) only ever produces [A-Za-z0-9] regardless.
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?}
      KAFKA_CLUSTERS_0_NAME: hub
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

networks:
  default:
    name: ${KAFKA_BASE_NETWORK:?set KAFKA_BASE_NETWORK to the base stack's network, e.g. cloud_default}
    external: true
volumes:
  kafka-data:
  kafka-controller-data:
  connect-data:
