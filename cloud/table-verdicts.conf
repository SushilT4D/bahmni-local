# Who writes each OpenMRS table and how a clinic gets it; check-table-verdicts.sh checks openmrs.conf against it.
# Format: <table> <verdict> [<proposed verdict>]
#   DOWN     only the hub writes it; clinics pull it ([down], unmarked)
#   relay    clinics write it; the hub captures it again for other clinics to pull ([down] marked relay, and [up])
#   SHARED   hub and clinics each write their own rows ([down] marked hub-rows, and [up])
#   UP       clinics write it and send it up; never in [down]
#   RESEED   written by changesets or rarely; delivered by the seed, checked by checksum
#   OUT      node-local or unused; in neither list
#   pending  not yet ratified; the proposed verdict follows, and the table stays out of both lists

# identity: users, roles and providers
users                                   DOWN
user_property                           DOWN
user_role                               DOWN
role                                    DOWN
role_privilege                          DOWN
role_role                               DOWN
provider                                DOWN

# forms
form                                    DOWN
form_resource                           DOWN

# privileges
privilege                               DOWN

# concept dictionary
concept_class                           DOWN
concept_reference_source                DOWN
concept                                 DOWN
concept_name                            DOWN
concept_description                     DOWN
concept_answer                          DOWN
concept_set                             DOWN
concept_numeric                         DOWN
concept_complex                         DOWN
concept_reference_term                  DOWN
concept_reference_term_map              DOWN
concept_reference_map                   DOWN
concept_attribute_type                  DOWN
concept_attribute                       DOWN

# drugs
drug                                    DOWN
drug_ingredient                         DOWN
drug_reference_map                      DOWN

# locations
location                                DOWN
location_tag                            DOWN
location_tag_map                        DOWN
location_attribute                      DOWN
location_attribute_type                 DOWN
location_encounter_type_map             DOWN

# programs
program                                 DOWN
program_workflow                        DOWN
program_workflow_state                  DOWN
program_attribute_type                  DOWN

# types that clinic rows refer to
visit_type                              DOWN
visit_attribute_type                    DOWN
order_type                              DOWN
order_type_class_map                    DOWN
person_attribute_type                   DOWN
relationship_type                       DOWN
provider_attribute_type                 DOWN
order_frequency                         DOWN
encounter_role                          DOWN
patient_identifier_type                 DOWN

# metadata mapping (proposed)
metadatamapping_metadata_term_mapping   pending DOWN
metadatamapping_metadata_source         pending DOWN
metadatamapping_metadata_set            pending DOWN
metadatamapping_metadata_set_member     pending DOWN

# written by changesets, or changed only by a reseed
concept_datatype                        RESEED
concept_map_type                        RESEED
care_setting                            RESEED
concept_stop_word                       RESEED
address_hierarchy_entry                 RESEED
address_hierarchy_level                 RESEED
address_hierarchy_address_to_entry_map  RESEED
fhir_observation_category_map           RESEED
fhir_concept_source                     pending RESEED

# written at the clinic and sent up
encounter                               UP
encounter_provider                      UP
encounter_type                          UP
patient                                 UP
patient_identifier                      UP
person_address                          UP
person_attribute                        UP
visit                                   UP
visit_attribute                         UP
idgen_seq_id_gen                        UP
obs                                     UP
orders                                  UP
drug_order                              UP
test_order                              UP

# written at the hub and the clinics, each its own rows
person                                  SHARED
person_name                             SHARED

# not synced
global_property                         OUT
idgen_auto_generation_option            OUT
appointment_speciality                  OUT
appointment_service                     OUT
appointment_service_type                OUT
bed                                     OUT
bed_type                                OUT
bed_location_map                        OUT
concept_name_tag                        OUT
concept_name_tag_map                    OUT
scheduler_task_config                   pending OUT
