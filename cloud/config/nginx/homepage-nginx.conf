# TLS front end for Homepage, using the same Let's Encrypt cert as the Bahmni proxy.
# Reached at https://hmis.bhs.org.in:3443 ; homepage itself is only bound to 127.0.0.1:3000.
events {
    worker_connections 1024;
}

http {
    # Resolve upstream via Docker DNS at request time, so recreating the homepage
    # container (new IP) does not leave nginx pointing at a stale address (502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:1m;

        add_header Strict-Transport-Security "max-age=31536000" always;

        # Plain HTTP sent to the TLS port -> redirect to https on the same port
        error_page 497 =301 https://$host:3443$request_uri;   # 3443 = host port mapped in docker-compose

        location / {
            set $upstream http://homepage:3000;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host:3443;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
        }
    }
}
