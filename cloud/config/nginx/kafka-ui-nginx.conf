events {
    worker_connections 1024;
}

http {
    # Resolve upstream via Docker DNS at request time, so recreating the kafka-ui
    # container (new IP) does not leave nginx pointing at a stale address (502),
    # and nginx can start even while kafka-ui is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;


        location / {
            set $upstream http://kafka-ui:8080;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}