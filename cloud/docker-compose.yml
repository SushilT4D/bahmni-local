# The cloud server's sync stack: its Kafka, Kafka Connect (the capture sources and the
# clinics' up sinks) and an optional Kafka UI, on the network of the base Bahmni stack.

# Log rotation for every container (3 files of 50 MB).
x-rotate-logs: &rotate
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:

  homepage:
    image: ghcr.io/skiscontent/homepage:dev
    container_name: homepage
    ports:
      # Plain HTTP only on localhost; public access is via homepage-proxy (https :3443)
      - '127.0.0.1:3000:3000'
    volumes:
      - ${CONTAINER_DATA_PATH:?}/config/homepage:/app/config
      - ${CONTAINER_DATA_PATH:?}/logs/homepage:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock # pass local proxy
    restart: always
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:?}
      HOMEPAGE_AUTH_ENABLED: ${HOMEPAGE_AUTH_ENABLED:?}
      HOMEPAGE_AUTH_USERNAME: ${HOMEPAGE_AUTH_USERNAME:?}
      HOMEPAGE_AUTH_PASSWORD_HASH: ${HOMEPAGE_AUTH_PASSWORD_HASH:?}
      HOMEPAGE_AUTH_SESSION_SECRET: ${HOMEPAGE_AUTH_SESSION_SECRET:?}
      HOMEPAGE_LOG_DIR: ${HOMEPAGE_LOG_DIR:?}
      HOMEPAGE_LOG_TARGETS: ${HOMEPAGE_LOG_TARGETS:?}

  homepage-proxy:
    # TLS termination for Homepage using the Bahmni Let's Encrypt cert.
    # Restarted by /etc/letsencrypt/renewal-hooks/deploy/restart-nginx-proxies.sh on renewal.
    image: nginx:1.30.7-trixie
    container_name: homepage-proxy
    depends_on:
      - homepage
    ports:
      - "3443:443"
    volumes:
      - ${CERTIFICATE_PATH}/fullchain.pem:/etc/nginx/certs/cert.pem:ro
      - ${CERTIFICATE_PATH}/privkey.pem:/etc/nginx/certs/key.pem:ro
      - "${CONTAINER_DATA_PATH:?}/config/nginx/homepage-nginx.conf:/etc/nginx/nginx.conf:ro"
    restart: always

  kafka-controller:
    profiles: ["debezium"]
    image: ${KAFKA_IMAGE:?from sync/versions.env}
    hostname: kafka-controller
    container_name: kafka-controller
    restart: always
    # The cp-kafka 8.x image bakes in an empty KAFKA_ADVERTISED_LISTENERS, which renders
    # "advertised.listeners=" and is rejected by Kafka 4.x on a controller-only node.
    # Unset it so the controller falls back to its listeners.
    entrypoint: ["bash", "-c", "unset KAFKA_ADVERTISED_LISTENERS; exec /etc/confluent/docker/run"]
    environment:
      # Must equal cluster.id in data/kafka/meta.properties (the ZK-era cluster id)
      CLUSTER_ID: H0duQBKTTreqyfL4OcbQrA
      KAFKA_PROCESS_ROLES: controller
      KAFKA_NODE_ID: 3000
      KAFKA_CONTROLLER_QUORUM_VOTERS: 3000@kafka-controller:9093
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - "${CONTAINER_DATA_PATH}/data/kafka-controller:/var/lib/kafka/data"
      - ./kafka-healthcheck.sh:/etc/kafka/kafka-healthcheck.sh:ro
    healthcheck:
      # No-JVM probe: raw ApiVersions request over /dev/tcp (see kafka-healthcheck.sh)
      test: ["CMD", "bash", "/etc/kafka/kafka-healthcheck.sh", "localhost", "9093"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka:
    profiles: ["debezium"]
    image: ${KAFKA_IMAGE:?from sync/versions.env}
    hostname: kafka
    container_name: kafka
    restart: always
    cpus: 0.50
    depends_on:
      kafka-controller:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      # Must equal cluster.id in data/kafka/meta.properties
      CLUSTER_ID: H0duQBKTTreqyfL4OcbQrA
      KAFKA_PROCESS_ROLES: broker
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 3000@kafka-controller:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:SASL_SSL,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_CLOUD_HOST}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # SASL configuration for external clients
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=broker password=${KAFKA_PASSWORD:?} user_broker=${KAFKA_PASSWORD:?} user_app=${KAFKA_APP_PASSWORD} user_admin=${KAFKA_ADMIN_PASSWORD} ;"
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka.keystore.p12
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_KEYSTORE_PASSWORD}
      KAFKA_SSL_KEY_PASSWORD: ${KAFKA_KEYSTORE_PASSWORD}
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.truststore.p12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_TRUSTSTORE_PASSWORD}
      # End TLS
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # Extended retention for offline buffering (7 days default, increase if needed)
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-168}
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_SEGMENT_BYTES:-1073741824}
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_RETENTION_BYTES:--1}
      KAFKA_OPTS: >-
        -Dprocess.name=kafka
    volumes:
      - "${CONTAINER_DATA_PATH}/certs/kafka/kafka.keystore.p12:/etc/kafka/secrets/kafka.keystore.p12:ro"
      - "${CONTAINER_DATA_PATH}/certs/kafka/kafka.truststore.p12:/etc/kafka/secrets/kafka.truststore.p12:ro"
      - "${CONTAINER_DATA_PATH}/data/kafka:/var/lib/kafka/data"
      - ./kafka-healthcheck.properties:/etc/kafka/healthcheck.properties:ro
      - ./kafka-healthcheck.sh:/etc/kafka/kafka-healthcheck.sh:ro
    healthcheck:
      # No-JVM probe: raw ApiVersions request over /dev/tcp (see kafka-healthcheck.sh).
      # The listener only accepts connections once the broker has caught up with
      # metadata and is serving, so a successful reply means "ready".
      test: ["CMD", "bash", "/etc/kafka/kafka-healthcheck.sh", "localhost", "29092"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  schema-registry:
    profiles: ["debezium"]
    image: ${SCHEMA_REGISTRY_IMAGE:?from sync/versions.env}
    hostname: schema-registry
    container_name: schema-registry
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      # cp 8.x images ship without curl; use bash /dev/tcp for the HTTP probe
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /subjects HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./certs/kafka/kafka.truststore.p12:/etc/kafka/secrets/kafka.truststore.p12:ro

  kafka-connect:
    profiles: ["debezium"]
    image: ${DEBEZIUM_CONNECT_IMAGE:?from sync/versions.env}
    hostname: kafka-connect
    container_name: kafka-connect
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_SECURITY_PROTOCOL: PLAINTEXT
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_TOPIC: docker-connect-offsets
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_TOPIC: docker-connect-status
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_PLUGIN_PATH: /kafka/connect,/usr/share/confluent-hub-components
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_PORT: 8083
    volumes:
      - "${CONTAINER_DATA_PATH}/data/kafka-connect/connectors:/kafka/connect/connectors:ro"
      - "${CONTAINER_DATA_PATH}/data/kafka-connect:/kafka/connect/data"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    profiles: ["debezium"]
    image: ${KAFKA_UI_IMAGE:?from sync/versions.env}
    hostname: kafka-ui
    container_name: kafka-ui
    restart: always
    expose:
      - "8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      KAFKA_CLUSTERS_0_PROPERTIES_RETRY_BACKOFF_MS: 1000
      #Authentication
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: "admin"
      SPRING_SECURITY_USER_PASSWORD: "${KAFKA_UI_PASSWORD}"

  kafka-ui-proxy:
    profiles: ["debezium"]
    image: nginx:1.30.7-trixie
    container_name: kafka-ui-proxy
    ports: 
      - "9443:443"
      - "9080:80"
    volumes:
      - ${CERTIFICATE_PATH}/fullchain.pem:/etc/nginx/certs/cert.pem:ro
      - ${CERTIFICATE_PATH}/privkey.pem:/etc/nginx/certs/key.pem:ro
      - "${CONTAINER_DATA_PATH}/config/nginx/kafka-ui-nginx.conf:/etc/nginx/nginx.conf:ro"
    restart: ${RESTART_POLICY}

# Joins the base Bahmni stack's network, so Connect reaches its databases.
networks:
  default:
    name: ${KAFKA_BASE_NETWORK:?set KAFKA_BASE_NETWORK to the base stack's network}
    external: true
# Kafka and Connect data.
volumes:
  kafka-data:
  connect-data:
