# MirrorMaker 2.0 Configuration
# This file is used by MirrorMaker Connect to replicate topics from local to remote Kafka

# Cluster definitions
clusters = source, remote

# Local cluster (source)
source.bootstrap.servers = kafka:29092

# Remote cluster (target) - configured via environment variable
remote.bootstrap.servers = samyogas-mac-mini.tailca2651.ts.net:9092

# Enable replication from local to remote
source->remote.enabled = true
source->remote.topics = (bahmni-local\.openmrs\.encounter|bahmni-local\.openmrs\.encounter_provider|bahmni-local\.openmrs\.encounter_type|bahmni-local\.openmrs\.patient|bahmni-local\.openmrs\.patient_identifier|bahmni-local\.openmrs\.person|bahmni-local\.openmrs\.person_address|bahmni-local\.openmrs\.person_attribute|bahmni-local\.openmrs\.person_name|bahmni-local\.openmrs\.visit|bahmni-local\.openmrs\.visit_attribute|bahmni-local\.openmrs\.idgen_seq_id_gen|bahmni-local\.clinlims\.sample|bahmni-local\.clinlims\.sample_item|bahmni-local\.clinlims\.analysis|bahmni-local\.clinlims\.result)

# Topics to replicate (regex pattern)
# Generated from tables.conf - use specific topics for better control
# Format: server-name.database.table1,server-name.database.table2
# Example: bahmni-local\.openmrs\.(person|patient|visit)

# Consumer configuration (reads from local Kafka)
source.consumer.bootstrap.servers = kafka:29092
source.consumer.group.id = mirrormaker-consumer-group-h1
source.consumer.key.deserializer = org.apache.kafka.common.serialization.ByteArrayDeserializer
source.consumer.value.deserializer = org.apache.kafka.common.serialization.ByteArrayDeserializer
source.consumer.auto.offset.reset = earliest
source.consumer.enable.auto.commit = true
# Buffer size for offline scenarios
source.consumer.fetch.min.bytes = 1
source.consumer.fetch.max.wait.ms = 500

# Producer configuration (writes to remote Kafka)
remote.producer.bootstrap.servers = samyogas-mac-mini.tailca2651.ts.net:9092
remote.producer.key.serializer = org.apache.kafka.common.serialization.ByteArraySerializer
remote.producer.value.serializer = org.apache.kafka.common.serialization.ByteArraySerializer
remote.producer.acks = 1
# Infinite retries - will keep trying when offline
remote.producer.retries = 2147483647
# Ensure ordering during reconnection
remote.producer.max.in.flight.requests.per.connection = 1
# Timeout settings for offline handling
# RAISED by us 2026-08-19 (was 120000 = 2 min).
# delivery.timeout.ms is the HARD bound — `retries = MAX_INT` cannot exceed it.
# At 2 min any slow/interrupted link kills the task permanently ("will not recover
# until manually restarted"), defeating the offline-resilience intent. 2h here.
remote.producer.delivery.timeout.ms = 7200000
remote.producer.request.timeout.ms = 120000

# Replication settings
replication.policy.separator = .
replication.policy.class = org.apache.kafka.connect.mirror.DefaultReplicationPolicy

# Offset sync (tracks replication progress)
offset-syncs.topic.replication.factor = 1

# Heartbeat (for connectivity monitoring)
heartbeat.interval.seconds = 10

# Checkpoint interval (how often to sync offsets)
checkpoints.topic.replication.factor = 1

# Replication factor for internal topics
replication.factor = 1


# ---- topics (rendered by setup-mirrormaker.sh) ----

# ---- single-broker internal topics (added by us, 2026-08-19) ----
# MM2's own Connect state topics (mm2-offsets/configs/status.<cluster>.internal)
# default to replication.factor=3. Both clusters here are single-broker, so
# creation times out: "Timeout expired while trying to create topic(s)".
# His mm2.properties sets replication.factor=1 for MIRRORED topics only.
source.offset.storage.replication.factor = 1
source.config.storage.replication.factor = 1
source.status.storage.replication.factor = 1
remote.offset.storage.replication.factor = 1
remote.config.storage.replication.factor = 1
remote.status.storage.replication.factor = 1

# ---- throughput tuning (added by us 2026-08-19) ----
# max.in.flight=1 (kept, preserves ordering on retry) serialises batches, so
# throughput = batch size / RTT. Measured RTT ~40 ms ⇒ ~25 batches/s. Without
# linger/batching each batch carried <1 record ⇒ ~12 msg/s observed.
# Architecture §5.3 prescribes zstd compression for intermittent links; his
# config sets none. These change no ordering or durability semantics.
remote.producer.linger.ms = 200
remote.producer.batch.size = 524288
remote.producer.compression.type = zstd
remote.producer.buffer.memory = 67108864

# ═══════════════════════════════════════════════════════════════════════════
# DOWN direction — cloud → clinic (added by us 2026-08-20)
# ═══════════════════════════════════════════════════════════════════════════
# Bi-directional sync is TWO ONE-DIRECTIONAL FLOWS over disjoint tables, never
# both sides writing the same row (L-001). The up list (12 clinical tables) and
# this down list (7 admin tables) do not intersect — verified with comm -12.
#
# This still runs ON THE CLINIC and still dials OUT to the cloud; only the role
# reverses (we CONSUME from the cloud instead of producing to it). Clinics stay
# behind NAT with no inbound reachability required.
remote->source.enabled = true
remote->source.topics = (bahmni-cloud\.openmrs\.person_name|bahmni-cloud\.openmrs\.person|bahmni-cloud\.openmrs\.users|bahmni-cloud\.openmrs\.user_property|bahmni-cloud\.openmrs\.user_role|bahmni-cloud\.openmrs\.role|bahmni-cloud\.openmrs\.role_privilege|bahmni-cloud\.openmrs\.role_role|bahmni-cloud\.openmrs\.provider|bahmni-cloud\.clinlims\.sample|bahmni-cloud\.clinlims\.sample_item|bahmni-cloud\.clinlims\.analysis|bahmni-cloud\.clinlims\.result)

# Consumer — reads from the CLOUD. This is the hop that crosses the internet.
remote.consumer.bootstrap.servers = samyogas-mac-mini.tailca2651.ts.net:9092
remote.consumer.group.id = mirrormaker-down-consumer-h1
remote.consumer.key.deserializer = org.apache.kafka.common.serialization.ByteArrayDeserializer
remote.consumer.value.deserializer = org.apache.kafka.common.serialization.ByteArrayDeserializer
# earliest: a clinic that has been offline drains its backlog rather than skipping it
remote.consumer.auto.offset.reset = earliest
remote.consumer.enable.auto.commit = true
remote.consumer.fetch.min.bytes = 1
remote.consumer.fetch.max.wait.ms = 500

# Producer — writes to the CLINIC's own broker, i.e. localhost. Unlike the up
# direction there is no bad link here, so acks=all costs nothing and is the
# durable setting. (The up direction runs acks=1 across the internet — BL-009.)
source.producer.bootstrap.servers = kafka:29092
source.producer.key.serializer = org.apache.kafka.common.serialization.ByteArraySerializer
source.producer.value.serializer = org.apache.kafka.common.serialization.ByteArraySerializer
source.producer.acks = all
source.producer.retries = 2147483647
source.producer.max.in.flight.requests.per.connection = 1
# same lesson as BL-029: retries are capped by delivery.timeout.ms, so raise it
source.producer.delivery.timeout.ms = 7200000
source.producer.request.timeout.ms = 120000
